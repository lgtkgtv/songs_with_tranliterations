vocabulary:
   - word: "Na jaane kyun"
     pronunciation: "Naa jaa-ne kyoon"
     meaning: "Literally 'Don't know why,' but colloquially translates to 'I wonder why' or 'Who knows why.' Expresses a sense of bewilderment or rhetorical questioning."
   - word: "Zindagi"
     pronunciation: "Zin-da-gee"
     meaning: "Life. Often used in a reflective or philosophical context."
   - word: "Achanak"
     pronunciation: "A-cha-nak"
     meaning: "Suddenly, all of a sudden, unexpectedly. Implies an abrupt and unannounced event."
   - word: "Dil"
     pronunciation: "Dil"
     meaning: "Heart. Metaphorically represents emotions, feelings, love, and the core of one's being."
   - word: "Aa jaaye"
     pronunciation: "Aa jaa-ye"
     meaning: "To come upon, to fall upon. In this context, 'dil kisi pe aa jaaye' means the heart falls for someone or develops feelings for someone."
   - word: "Baat baat mein"
     pronunciation: "Baat baat mein"
     meaning: "In every conversation, so easily, in an instant. Implies something happening quickly or without much effort."
   - word: "Jabki"
     pronunciation: "Jab-ki"
     meaning: "Whereas, even though, despite the fact that. Used to introduce a contrasting or contradictory statement."
   - word: "Apna na hoga"
     pronunciation: "Ap-na naa ho-ga"
     meaning: "Will not be ours. 'Apna' means 'one's own' or 'belonging to me/us,' so the phrase conveys the impossibility of a desired possession or relationship."
   - word: "Chaahat"
     pronunciation: "Chaa-hat"
     meaning: "Longing, desire, deep affection, yearning. A strong emotional pull towards someone or something."
   - word: "Ban jaaye paagal"
     pronunciation: "Ban jaa-ye paa-gal"
     meaning: "To become mad, to lose one's senses. Used metaphorically to express being deeply infatuated or obsessed with someone."
   - word: "Meethi"
     pronunciation: "Mee-thee"
     meaning: "Sweet. Used here to describe memories as pleasant, cherished, and endearing."
   - word: "Bheege"
     pronunciation: "Bhee-ge"
     meaning: "Wet. 'Bheege pal' (wet moments) often refers to moments filled with emotion, perhaps tears, nostalgia, or a deep, poignant feeling."
   - word: "Unchhalta hua"
     pronunciation: "Un-chhal-ta hoo-aa"
     meaning: "Bouncing, leaping, restless. Describes a heart or mind that is agitated, excited, or full of unresolved emotions."
   - word: "Bebasi"
     pronunciation: "Be-ba-see"
     meaning: "Helplessness, powerlessness. The state of being unable to do anything about a situation."
   - word: "Tadap"
     pronunciation: "Ta-dap"
     meaning: "Yearning, agony, craving, intense suffering. A deep emotional pain caused by longing or separation."
   - word: "Guzar jaaye"
     pronunciation: "Goo-zar jaa-ye"
     meaning: "To pass, to be spent (time). Refers to the flow or duration of time."
   - word: "Yaadon"
     pronunciation: "Yaa-don"
     meaning: "Memories (plural of 'yaad'). Remembrances of past events or people."
   - word: "Khayalon"
     pronunciation: "Kha-yaa-lon"
     meaning: "Thoughts, imaginations (plural of 'khayal'). The content of one's mind."
   - word: "Mulaqaatein"
     pronunciation: "Moo-laa-qaa-tein"
     meaning: "Meetings, encounters (plural of 'mulaqaat'). Typically refers to brief or casual meetings."
   - word: "Lamhe bhar ki"
     pronunciation: "Lam-he bhar kee"
     meaning: "For a moment, momentary. Describes something that lasts for a very short duration."
   - word: "Adhoore"
     pronunciation: "A-dhoo-re"
     meaning: "Incomplete, unfinished, partial. Often carries a sense of wistfulness or unfulfillment."
   - word: "Armaan"
     pronunciation: "Ar-maan"
     meaning: "Desires, wishes, aspirations. Often refers to deep-seated hopes or longings."
   - word: "Saath"
     pronunciation: "Saath"
     meaning: "Companionship, company, together. Can refer to physical presence or emotional support."
   - word: "Silsila"
     pronunciation: "Sil-si-laa"
     meaning: "Sequence, chain, series, continuous flow. Here, it refers to the ongoing nature of these experiences."
   - word: "Intezaar"
     pronunciation: "In-te-zaar"
     meaning: "Wait, expectation. The act of waiting for someone or something."
   - word: "Talaash"
     pronunciation: "Ta-laash"
     meaning: "Search, quest. The act of seeking or looking for someone or something."