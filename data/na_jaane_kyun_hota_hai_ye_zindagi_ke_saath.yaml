title: Na Jaane Kyun Hota Hai Ye Zindagi Ke Saath
movie: Chhoti Si Baat
year: '1976'
singers: Lata Mangeshkar
actors:
- Amol Palekar
- Vidya Sinha
- Ashok Kumar
- Asrani
composer: Salil Chowdhury
lyricist: Yogesh
youtube_channel: Shemaroo Filmi Gaane
resolution: Unknown
theme: The song reflects on the inexplicable nature of life and relationships. It
  explores the bittersweet reality of connections that form unexpectedly, often defying
  societal norms or personal control, much like riverbanks that are always close yet
  never truly meet. It conveys a sense of acceptance towards life's unpredictable
  joys and sorrows, and the enduring bond of love.
lyrics:
- roman: Na jaane kyun, hota hai ye zindagi ke saath
  devanagari: ना जाने क्यों, होता है ये ज़िंदगी के साथ
  english: Don't know why, this happens with life
- roman: Achanak ye dil, kisi ke ho jaaye saath
