- section_name: Verse 2
  lines:
  - roman: Jinhe humne chaha, jinhe humne pooja
    devanagari: जिन्हें हमने चाहा, जिन्हें हमने पूजा
    english: Those whom we loved, whom we adored
    is_repeat: false
  - roman: Nazar se woh door jaate rahe
    devanagari: नज़र से वो दूर जाते रहे
