   - roman: "Chhoti chhoti mulaqaatein"
     devanagari: "छोटी छोटी मुलाक़ातें"
     english: "Small, little meetings"
   - roman: "Lamhe bhar ki baatein"
     devanagari: "लम्हे भर की बातें"
     english: "Conversations for a moment"
   - roman: "Adhoore se armaan"
     devanagari: "अधूरे से अरमान"
     english: "Incomplete desires"
   - roman: "Unka adhoora sa saath"
     devanagari: "उनका अधूरा सा साथ"
     english: "Their incomplete companionship"
   - roman: "Bas yun hi chalta rahe ye silsila"
     devanagari: "बस यूँ ही चलता रहे ये सिलसिला"
