title: "Na Jaane Kyun Hota Hai Ye Zindagi Ke Saath"
movie: "Chhoti Si Baat"
year: 1976
singers: "Lata Mangeshkar"
lyricist: "Yogesh Gaud"
composer: "Salil Chowdhury"
youtube_id: "cJT3de5BOik"
theme: "This song beautifully captures the bittersweet essence of life's unpredictable journey and the ephemeral nature of human connections. It reflects on the inexplicable way hearts connect, despite knowing the eventual pain of separation, and how cherished memories endure even after relationships fade, leaving a sense of wistful longing."
lyrics:
   - roman: "Na jaane kyun hota hai ye zindagi ke saath"
     devanagari: "ना जाने क्यों होता है ये ज़िंदगी के साथ"
     english: "I wonder why this happens with life"
   - roman: "Achanak ye dil kisi pe aa jaaye baat baat mein"
     devanagari: "अचानक ये दिल किसी पे आ जाए बात बात में"
     english: "Suddenly, this heart falls for someone in an instant"
   - roman: "Na jaane kyun hota hai ye zindagi ke saath"
     devanagari: "ना जाने क्यों होता है ये ज़िंदगी के साथ"
     english: "I wonder why this happens with life"
   - roman: "Achanak ye dil kisi pe aa jaaye baat baat mein"
     devanagari: "अचानक ये दिल किसी पे आ जाए बात बात में"
     english: "Suddenly, this heart falls for someone in an instant"
   - roman: "Jabki jaante hai hum wo kabhi apna na hoga"
     devanagari: "जबकि जानते है हम वो कभी अपना ना होगा"
     english: "Even though we know they will never truly be ours"
   - roman: "Phir bhi usiki chaahat mein ban jaaye paagal"
     devanagari: "फिर भी उसीकी चाहत में बन जाए पागल"
     english: "Still, we become mad in their longing"
   - roman: "Na jaane kyun hota hai ye zindagi ke saath"
     devanagari: "ना जाने क्यों होता है ये ज़िंदगी के साथ"
     english: "I wonder why this happens with life"
   - roman: "Achanak ye dil kisi pe aa jaaye baat baat mein"
     devanagari: "अचानक ये दिल किसी पे आ जाए बात बात में"
     english: "Suddenly, this heart falls for someone in an instant"
   - roman: "Meethi meethi si yaadien ho"
     devanagari: "मीठी मीठी सी यादें हो"
     english: "There are sweet memories"
   - roman: "Bheege bheege se pal ho"
     devanagari: "भीगे भीगे से पल हो"
     english: "There are wet (emotional) moments"
   - roman: "Unchhalta hua mann ho"
     devanagari: "उछलता हुआ मन हो"
     english: "There is a bouncing heart"
   - roman: "Bebasi ho, tadap ho"
     devanagari: "बेबसी हो, तड़प हो"
     english: "There is helplessness, there is yearning"
   - roman: "Har pal har din aise hi guzar jaaye"
     devanagari: "हर पल हर दिन ऐसे ही गुज़र जाए"
     english: "Every moment, every day passes like this"
   - roman: "Kisi ki yaadon mein, kisi ke khayalon mein"
     devanagari: "किसी की यादों में, किसी के ख्यालों में"
     english: "In someone's memories, in someone's thoughts"
   - roman: "Na jaane kyun hota hai ye zindagi ke saath"
     devanagari: "ना जाने क्यों होता है ये ज़िंदगी के साथ"
