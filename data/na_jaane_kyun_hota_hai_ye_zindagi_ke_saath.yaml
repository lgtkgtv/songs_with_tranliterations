title: Na Jaane Kyun Hota Hai Ye Zindagi Ke Saath
movie: Chhoti Si Baat
year: '1976'
singers: Lata Mangeshkar
actors:
- Amol Palekar
- Vidya Sinha
- Ashok Kumar
composer: Salil Chowdhury
lyricist: Yogesh
youtube_channel: Saregama Music
resolution: 1080p
theme: This song explores the bittersweet nature of life, the inexplicable changes
  it brings, and the fleeting moments of joy and sorrow. It reflects on the unpredictable
  journey of existence and the quiet acceptance of its mysteries, often highlighting
  the pain of separation and lost connections.
lyrics:
- section_name: Chorus
  lines:
  - roman: Na jaane kyun hota hai ye zindagi ke saath
    devanagari: ना जाने क्यों होता है ये ज़िंदगी के साथ
    english: Don't know why this happens with life
    is_repeat: false
  - roman: Achaanak ye man kisike jaane ke baad
    devanagari: अचानक ये मन किसी के जाने के बाद
    english: Suddenly, this heart, after someone leaves
    is_repeat: false
  - roman: Kare phir uski yaad, chhoti chhoti si baat
    devanagari: करे फिर उसकी याद, छोटी छोटी सी बात
    english: Then remembers them, even small things
    is_repeat: false
  - roman: Na jaane kyun hota hai ye zindagi ke saath
    devanagari: ना जाने क्यों होता है ये ज़िंदगी के साथ
    english: Don't know why this happens with life
    is_repeat: false
- section_name: Verse 1
  lines:
  - roman: Jo anjaan ban ke mile the kabhi
    devanagari: जो अनजान बन के मिले थे कभी
    english: Those who met as strangers once
    is_repeat: false
  - roman: Aaj woh doston mein gine jaate hain
    devanagari: आज वो दोस्तों में गिने जाते हैं
    english: Today, they are counted among friends
    is_repeat: false
  - roman: Mohabbat ki raahon mein hansne lage
    devanagari: मोहब्बत की राहों में हंसने लगे
    english: They started laughing on the paths of love
    is_repeat: false
  - roman: Haseen dard ban ke chubhe jaate hain
    devanagari: हसीन दर्द बन के चुभे जाते हैं
    english: They pierce like beautiful pain
    is_repeat: false
