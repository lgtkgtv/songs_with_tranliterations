title: Gulon Mein Rang Bhare
movie: Ghazal
year: '1964'
singers: Mehdi Hassan
actors:
- Mehdi Hassan
composer: Mehdi Hassan
lyricist: Faiz Ahmed Faiz
youtube_channel: EMI Pakistan
resolution: Standard Definition
theme: This ghazal expresses a deep yearning for the beloved's return, which is anticipated
  to bring joy, beauty, and renewal to the world. It metaphorically describes how
  the beloved's presence would fill flowers with color and the air with fragrance,
  signifying the revival of hope and life amidst separation and longing.
lyrics:
- section_name: Matla
  lines:
  - roman: Gulon mein rang bhare baad-e-nau-bahār chale
    devanagari: गुलों में रंग भरे बाद-ए-नौ-बहार चले
    english: May flowers be filled with color, may the breeze of new spring blow.
    is_repeat: false
  - roman: Chale bhi aao ke gulshan ka karobar chale
    devanagari: चले भी आओ के गुलशन का कारोबार चले
    english: Do come, so that the garden's affairs may proceed.
    is_repeat: false
- section_name: Couplet 1
  lines:
  - roman: Qafas udaas hai yaaron saba se kuch to kaho
    devanagari: क़फ़स उदास है यारों सबा से कुछ तो कहो
    english: The cage is sad, friends, say something to the morning breeze.
    is_repeat: false
  - roman: Kahin to bahr-e-khuda aaj zikr-e-yaar chale
    devanagari: कहीं तो बहर-ए-ख़ुदा आज ज़िक्र-ए-यार चले
    english: For God's sake, let there be some mention of the beloved today.
    is_repeat: false
- section_name: Couplet 2
  lines:
  - roman: Kabhi to subh tere kunj-e-lab se ho aaghaaz
    devanagari: कभी तो सुब्ह तेरे कुंज-ए-लब से हो आग़ाज़
    english: May morning sometimes begin from the corner of your lips.
    is_repeat: false
  - roman: Kabhi to shab sar-e-kākul se mushk-bār chale
    devanagari: कभी तो शब सर-ए-काकुल से मुश्क-बार चले
    english: May night sometimes spread fragrance from your locks of hair.
    is_repeat: false
- section_name: Couplet 3
  lines:
  - roman: Baṛā hai dard ka rishta ye dil ghareeb sahi
    devanagari: बड़ा है दर्द का रिश्ता ये दिल ग़रीब सही
    english: Great is the bond of pain, though this heart may be poor.
    is_repeat: false
  - roman: Tumhare naam pe aayenge ghamgusār chale
    devanagari: तुम्हारे नाम पे आएंगे ग़मगुसार चले
    english: On your name, comforters will come.
    is_repeat: false
- section_name: Couplet 4
  lines:
  - roman: Jo hum pe guzri so guzri magar shab-e-hijrāñ
    devanagari: जो हम पे गुज़री सो गुज़री मगर शब-ए-हिज्राँ
    english: What befell us, befell us, but the night of separation,
    is_repeat: false
  - roman: Hamare ashk teri āqibat sanwār chale
    devanagari: हमारे अश्क तेरी आक़िबत संवार चले
    english: Our tears will adorn your afterlife.
    is_repeat: false
- section_name: Couplet 5
  lines:
  - roman: Huzoor-e-yaar mein harf-e-tamannā kya maani
    devanagari: हुज़ूर-ए-यार में हर्फ़-ए-तमन्ना क्या मानी
    english: In the beloved's presence, what is the meaning of words of desire?
    is_repeat: false
  - roman: Ke be kahe bhi unhe sab khabar hai yaar chale
    devanagari: के बे कहे भी उन्हें सब ख़बर है यार चले
    english: For even without speaking, the beloved knows everything.
    is_repeat: false
- section_name: Maqta
  lines:
  - roman: Ikhtiyārāt-e-tassavvur bhi hain kya kya ke Faiz
    devanagari: इख़्तियारात-ए-तसव्वुर भी हैं क्या क्या के फ़ैज़
    english: What powers of imagination there are, O Faiz,
    is_repeat: false
  - roman: Ke jab bhi chaheñ sar-e-rāh-e-intizār chale
    devanagari: के जब भी चाहें सर-ए-राह-ए-इंतिज़ार चले
    english: That whenever we wish, we walk on the path of waiting.
    is_repeat: false
