title: Aaja Sanam Madhur Chandini Mein Hum
movie: Chori Chori
year: '1956'
singers: Lata Mangeshkar, Manna Dey
actors:
- Raj Kapoor
- Nargis
composer: Shankar-Jaikishan
lyricist: Hasrat Jaipuri
youtube_channel: Raj Kapoor
resolution: HD
theme: This song is a classic romantic duet where two lovers express their desire
  to meet in the sweet moonlight, escape to a new world, and find a secluded haven
  for their love, believing that their union will bring joy and beauty even to desolate
  places. It speaks of deep yearning and the transformative power of love.
lyrics:
- section_name: Chorus
  lines:
  - roman: Aaja sanam madhur chandini mein hum
    devanagari: आजा सनम मधुर चाँदनी में हम
    english: Come, my beloved, in this sweet moonlight, we
    is_repeat: false
  - roman: Tum milein to veerane mein bhi aa jaayegi bahaar
    devanagari: तुम मिलो तो वीराने में भी आ जाएगी बहार
    english: If you meet me, even in a wilderness, spring will arrive.
    is_repeat: false
  - roman: Jhoomne lagega aasman
    devanagari: झूमने लगेगा आसमान
    english: The sky will begin to sway.
    is_repeat: false
  - roman: Jhoomne lagega aasman
