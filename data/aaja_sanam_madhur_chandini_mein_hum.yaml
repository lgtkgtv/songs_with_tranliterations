vocabulary:
- word: Sanam
  pronunciation: Sa-nam
  meaning: Beloved, sweetheart.
- word: Madhur
  pronunciation: Ma-dhur
  meaning: Sweet, melodious, pleasant.
- word: Chandini
  pronunciation: Chan-di-ni
  meaning: Moonlight.
- word: Veerane
  pronunciation: Vee-raa-ne
  meaning: Wilderness, desolate place, barren land.
- word: Bahaar
  pronunciation: Ba-haar
  meaning: Spring, bloom, prosperity, joy.
- word: Jhoomne lagega
  pronunciation: Jhoom-ne la-ge-ga
  meaning: Will start swaying, will begin to dance or swing joyfully.
- word: Aasman
  pronunciation: Aas-maan
  meaning: Sky, heaven.
- word: Machalta hai
  pronunciation: Ma-chal-ta hai
  meaning: Yearns, becomes restless, fidgets, is agitated by desire.
- word: Saajan
  pronunciation: Saa-jan
  meaning: Beloved, darling (often used for a male lover or husband).
- word: Taaron ke paar
  pronunciation: Taa-ron ke paar
  meaning: Beyond the stars.
- word: Sansaar
  pronunciation: San-saar
  meaning: World, universe, life.
- word: Basa lein
  pronunciation: Ba-saa lein
  meaning: Let's build, let's settle, let's establish.
- word: Jaan-e-wafa
  pronunciation: Jaan-e-wa-faa
  meaning: O faithful beloved (literally 'soul of faithfulness').
- word: Chaman
  pronunciation: Cha-man
  meaning: Garden, flowerbed.
- word: Guzaara nahin
  pronunciation: Gu-zaa-raa na-hin
  meaning: Cannot live, no sustenance, no survival, cannot make a living.
- word: Manzil
  pronunciation: Man-zil
  meaning: Destination, goal, objective.
