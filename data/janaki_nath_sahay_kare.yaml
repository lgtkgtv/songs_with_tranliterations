vocabulary:
- word: Janaki Nath
  pronunciation: Jaa-na-kee Naath
  meaning: Lord of Janaki (Sita), an epithet for Lord Rama.
- word: Sahay
  pronunciation: Sa-hay
  meaning: Help, assistance.
- word: Kare
  pronunciation: Ka-re
  meaning: Does, performs; in this context, 'may do' or 'may help'.
- word: Ram Naam
  pronunciation: Raam Naam
  meaning: The name of Lord Rama.
- word: Sumiran
  pronunciation: Su-mi-ran
  meaning: Remembrance, contemplation, chanting, meditation on a divine name.
- word: Sankat
  pronunciation: San-kat
  meaning: Trouble, distress, calamity, danger.
- word: Door
  pronunciation: Door
  meaning: Far, away, distant.
- word: Jaap
  pronunciation: Jaap
  meaning: Chanting, repetition of a mantra or divine name.
- word: Beda Paar
  pronunciation: Be-daa Paar
  meaning: 'To cross the river, to overcome difficulties, to achieve salvation or
    success. (Literally: ''boat across'').'
- word: Mahima
  pronunciation: Ma-hi-maa
  meaning: Glory, greatness, majesty, divine power.
- word: Aparampar
  pronunciation: A-pa-ram-par
  meaning: Boundless, infinite, immeasurable, without limit.
- word: Gaaye
  pronunciation: Gaa-ye
  meaning: Sings, chants.
- word: Uddhar
  pronunciation: Ud-dhaar
  meaning: Salvation, liberation, upliftment, rescue from distress.
