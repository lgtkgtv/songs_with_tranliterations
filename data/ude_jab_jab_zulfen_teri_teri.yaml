vocabulary:
- word: Ude
  pronunciation: Oo-day
  meaning: To fly, to flutter, to rise.
- word: Jab jab
  pronunciation: Jub jub
  meaning: Whenever, every time.
- word: Zulfen
  pronunciation: Zool-fen
  meaning: Tresses, locks of hair (plural).
- word: Teri
  pronunciation: Tay-ree
  meaning: Your (feminine singular, informal).
- word: Kawaariyon
  pronunciation: Ka-waa-ree-yon
  meaning: Of virgins, of unmarried girls.
- word: Dil
  pronunciation: Dil
  meaning: Heart.
- word: Machle
  pronunciation: Much-lay
  meaning: To yearn, to be restless, to flutter with desire.
- word: Jee kare
  pronunciation: Jee ka-ray
  meaning: My heart desires, I feel like.
- word: Dekhte rahen
  pronunciation: Dekh-tay ra-hen
  meaning: To keep looking, to continue watching.
- word: Guzre
  pronunciation: Gooz-ray
  meaning: To pass by, to go past.
- word: Reshami
  pronunciation: Ray-shum-ee
  meaning: Silken, made of silk.
- word: Ujala
  pronunciation: Oo-jaa-laa
  meaning: Light, brightness.
- word: Makhmali
  pronunciation: Mukh-muh-lee
  meaning: Velvety, soft like velvet.
- word: Andhera
  pronunciation: Un-dhay-raa
  meaning: Darkness.
- word: Gore gore
  pronunciation: Gor-ay gor-ay
  meaning: Fair, very fair (often referring to complexion).
- word: Gaalon
  pronunciation: Gaa-lon
  meaning: Cheeks (plural, oblique case).
- word: Shaam
  pronunciation: Shaam
  meaning: Evening, dusk.
- word: Basera
  pronunciation: Ba-say-raa
  meaning: Dwelling, abode, resting place.
- word: Nazar
  pronunciation: Na-zur
  meaning: Gaze, sight, vision.
- word: Utre
  pronunciation: Oot-ray
  meaning: To descend, to get off, to leave (in context, 'not leave my sight').
- word: Baj uthe
  pronunciation: Buj oot-hay
  meaning: To ring out, to start playing (sound).
- word: Payal
  pronunciation: Paa-yul
  meaning: Anklet (a type of traditional Indian jewelry worn on the ankle).
- word: Chham chham
  pronunciation: Chhum chhum
  meaning: Onomatopoeic sound of anklets jingling.
- word: Kahin pe
  pronunciation: Ka-heen pay
  meaning: Somewhere, anywhere.
- word: Samaaye
  pronunciation: Sa-maa-yay
  meaning: To be absorbed, to settle in, to fit into.
- word: Haaye re
  pronunciation: Haa-yay ray
  meaning: An exclamation of surprise, longing, or mild distress; 'Oh dear!'
- word: Chal ke na thahre
  pronunciation: Chul kay na thuh-hray
  meaning: Don't stop walking (literally, 'walking, don't stop').
- word: Sun ke
  pronunciation: Soon kay
  meaning: Hearing, after listening.
- word: Baatein
  pronunciation: Baa-ten
  meaning: Talks, words, conversations.
- word: Dole
  pronunciation: Doh-lay
  meaning: To swing, to sway, to flutter (referring to the heart).
- word: Kaanon mein
  pronunciation: Kaa-non mayn
  meaning: In the ears.
- word: Ras ghole
  pronunciation: Rus gho-lay
  meaning: To dissolve sweetness, to sweeten (metaphorically, to speak sweetly).
- word: Haule haule
  pronunciation: How-lay how-lay
  meaning: Slowly, gently, softly.
- word: Le le
  pronunciation: Lay lay
  meaning: Take (imperative, informal).
