vocabulary:
- word: Kora
  pronunciation: koh-raa
  meaning: Blank, empty, untouched, pure.
- word: Kagaz
  pronunciation: kaa-gaz
  meaning: Paper.
- word: Man
  pronunciation: mun
  meaning: Heart, mind, soul, inner self. Often used to refer to one's emotional core.
- word: Likh diya
  pronunciation: likh dee-yaa
  meaning: Wrote, inscribed. 'Likhna' means to write, 'diya' is the past participle
    of 'dena' (to give), here used as an auxiliary verb to indicate completion.
- word: Tera
  pronunciation: teh-raa
  meaning: Yours (informal singular).
- word: Soona
  pronunciation: soo-naa
  meaning: Empty, desolate, deserted, lonely.
- word: Aangan
  pronunciation: aan-gun
  meaning: Courtyard, patio, the open space in front or center of a house.
- word: Jeevan
  pronunciation: jee-vun
  meaning: Life.
- word: Bas gayaa
  pronunciation: bus guh-yaa
  meaning: Settled, resided, became established, filled up. 'Basna' means to settle
    or dwell.
- word: Pyaar
  pronunciation: pyaa-r
  meaning: Love.
- word: Toot na jaaye
  pronunciation: too-t naa jaa-ye
  meaning: May not break, shatter, or be destroyed. Expresses a fear or wish against
    something breaking.
- word: Sapne
  pronunciation: sup-ne
  meaning: Dreams (plural of 'sapna').
- word: Darta hoon
  pronunciation: dur-taa hooñ
  meaning: I fear, I am afraid. 'Darna' means to fear.
- word: Din raat
  pronunciation: din raa-t
  meaning: Day and night, continuously.
- word: Jeeta hoon
  pronunciation: jee-taa hooñ
  meaning: I live. 'Jeena' means to live.
- word: Jab se
  pronunciation: jub seh
  meaning: Since, ever since.
- word: Mili hai
  pronunciation: mi-lee hai
  meaning: Has met, has been found (feminine singular). 'Milna' means to meet or find.
- word: Nazar
  pronunciation: nuh-zur
  meaning: Gaze, sight, glance, vision.
- word: Laga hai
  pronunciation: luh-gaa hai
  meaning: Has begun, has started, has been applied. 'Lagana' means to apply, to start.
- word: Khushiyon
  pronunciation: khu-shee-yoñ
  meaning: Of happiness (genitive plural of 'khushi').
- word: Safar
  pronunciation: suh-fur
  meaning: Journey, travel.
- word: Kya kahoon
  pronunciation: kyaa kuh-hooñ
  meaning: What should I say?
- word: Na kahoon
  pronunciation: naa kuh-hooñ
  meaning: Not say.
- word: Bas itna hi
  pronunciation: bus it-naa hee
  meaning: Just this much, only this.
- word: Kehna hai
  pronunciation: keh-naa hai
  meaning: Have to say, is to be said. 'Kehna' means to say.
- word: Milkar
  pronunciation: mil-kur
  meaning: After meeting, together (gerund of 'milna').
- word: Marna hai
  pronunciation: mur-naa hai
  meaning: Have to die, is to die. 'Marna' means to die.
