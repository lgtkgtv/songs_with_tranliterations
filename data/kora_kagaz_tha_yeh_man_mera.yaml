vocabulary:
- word: Kora
  pronunciation: koh-raa
  meaning: Blank, empty, untouched, pristine.
- word: Kaagaz
  pronunciation: kaa-gaz
  meaning: Paper.
- word: Man
  pronunciation: mun
  meaning: Mind, heart, inner self, soul. Often refers to one's emotional and mental
    being.
- word: Likh diya
  pronunciation: likh dee-yaa
  meaning: Wrote, inscribed. 'Likhna' means to write, 'diya' is the past participle
    of 'dena' (to give), here used as an auxiliary verb to complete the action.
- word: Tera
  pronunciation: teh-raa
  meaning: Yours (informal, singular).
- word: Soona
  pronunciation: soo-naa
  meaning: Empty, desolate, lonely, deserted.
- word: Aangan
  pronunciation: aan-gan
  meaning: Courtyard, an open space in front of or within a house. Metaphorically,
    one's personal space or life.
- word: Jeevan
  pronunciation: jee-van
  meaning: Life.
- word: Bas gaya
  pronunciation: bus ga-yaa
  meaning: Settled, resided, filled up, made a home. Implies a permanent or deep establishment.
- word: Pyaar
  pronunciation: pyaa-r
  meaning: Love.
- word: Toot na jaaye
  pronunciation: toot naa jaa-ye
  meaning: May not break, may not shatter. Expresses a fear or hope against something
    breaking.
- word: Sapne
  pronunciation: sup-ne
  meaning: Dreams (plural of 'sapna').
- word: Darta hoon
  pronunciation: dur-taa hoon
  meaning: I am afraid, I fear.
- word: Din rain
  pronunciation: din rain
  meaning: Day and night (poetic, 'din' is day, 'rain' is night).
- word: Socha karta hoon
  pronunciation: so-chaa kur-taa hoon
  meaning: I keep thinking, I habitually think. 'Sochna' means to think, 'karna' means
    to do, here used to denote continuous action.
- word: Kahi
  pronunciation: ka-hee
  meaning: Lest, somewhere, perhaps. Used to express a slight apprehension.
- word: Nain
  pronunciation: nain
  meaning: Eyes (poetic and often used in songs, similar to 'aankhein').
- word: Chhoot na jaayein
  pronunciation: chhoot naa jaa-yein
  meaning: May not be left behind, may not get separated, may not slip away.
- word: Dard
  pronunciation: dard
  meaning: Pain, ache, suffering.
- word: Had
  pronunciation: hud
  meaning: Limit, boundary, extent.
- word: Guzarta hai
  pronunciation: goo-zar-taa hai
  meaning: Passes, crosses, goes by. 'Guzarna' means to pass.
- word: Aise mein
  pronunciation: ai-se mein
  meaning: In such a situation, at such a time, in such a state.
- word: Dil
  pronunciation: dil
  meaning: Heart.
- word: Pakadta hai
  pronunciation: pa-kard-taa hai
  meaning: Holds, catches, grasps. Here, metaphorically, 'supports' or 'comforts'.
- word: Chain
  pronunciation: chain
  meaning: Peace, comfort, tranquility.
- word: Neend
  pronunciation: neend
  meaning: Sleep.
- word: Aapka
  pronunciation: aap-kaa
  meaning: Yours (formal, respectful).
- word: Shubh
  pronunciation: shubh
  meaning: Auspicious, good, fortunate.
- word: Naam
  pronunciation: naam
  meaning: Name.
- word: Kya hai
  pronunciation: kyaa hai
  meaning: What is?
- word: Achha
  pronunciation: uch-haa
  meaning: Okay, good, fine.
- word: Chalo
  pronunciation: cha-lo
  meaning: Let's go, come on, fine (often used to move a conversation forward or concede).
- word: Batao
  pronunciation: ba-taa-o
  meaning: Tell (informal imperative of 'batana').
- word: Joda
  pronunciation: jo-daa
  meaning: Pair, couple.
- word: Dekho
  pronunciation: de-kho
  meaning: Look (informal imperative of 'dekhna').
- word: Kitne
  pronunciation: kit-ne
  meaning: How many, how much (plural or for uncountable nouns).
- word: Bhole
  pronunciation: bho-le
  meaning: Innocent, naive, simple-hearted.
- word: Pyaare
  pronunciation: pyaa-re
  meaning: Lovely, dear, charming (plural or respectful singular).
- word: Bante hain
  pronunciation: bun-te hain
  meaning: Are made, are formed, are created. 'Banna' means to be made/formed.
- word: Saare
  pronunciation: saa-re
  meaning: All, entire.
