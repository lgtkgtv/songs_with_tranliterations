vocabulary:
- word: Kora (कोरा)
  pronunciation: Koh-raa
  meaning: Blank, empty, untouched. Refers to something pristine or unused.
- word: Kagaz (कागज़)
  pronunciation: Kaa-gaz
  meaning: Paper. In this context, it symbolizes the mind or heart as a surface for
    experiences.
- word: Man (मन)
  pronunciation: Mun
  meaning: Mind, heart, soul, inner self. Often used to denote one's feelings and
    thoughts.
- word: Likh diya (लिख दिया)
  pronunciation: Likh dee-yaa
  meaning: Wrote (past tense). Implies an action of inscribing or marking permanently.
- word: Tera (तेरा)
  pronunciation: Teh-raa
  meaning: Your (informal, singular). Used when addressing a close friend or beloved.
- word: Soona (सूना)
  pronunciation: Soo-naa
  meaning: Desolate, empty, quiet, lonely. Describes a place or state lacking vibrancy.
- word: Aangan (आँगन)
  pronunciation: Aan-gun
  meaning: Courtyard, compound. The open space in front or within a house, often a
    place of gathering.
- word: Jeevan (जीवन)
  pronunciation: Jee-vun
  meaning: Life. The state of being alive; existence.
- word: Bas gaya (बस गया)
  pronunciation: Bus guh-yaa
  meaning: Settled, resided, made a home. Implies a permanent or deep establishment.
- word: Pyar (प्यार)
  pronunciation: Pyaa-r
  meaning: Love. A strong feeling of affection.
- word: Toot na jaaye (टूटना जाए)
  pronunciation: Too-t naa jaa-yeh
  meaning: May not break, lest it breaks. Expresses a fear or concern about something
    being shattered.
- word: Sapne (सपने)
  pronunciation: Sup-neh
  meaning: Dreams (plural of sapna). Aspirations, visions, or images experienced during
    sleep.
- word: Darta hoon (डरता हूँ)
  pronunciation: Dur-taa hoo
  meaning: I fear, I am afraid. Expresses a state of apprehension.
- word: Din rain (दिन रैन)
  pronunciation: Din rai-n
  meaning: Day and night. Continuously, constantly.
- word: Socha karta hoon (सोचा करता हूँ)
  pronunciation: Soh-chaa kur-taa hoo
  meaning: I keep thinking, I used to think. Implies a continuous or habitual thought
    process.
- word: Nainon (नैनों)
  pronunciation: Nai-no
  meaning: Eyes (poetic plural of 'nain'). Often used in poetry for a more lyrical
    feel.
- word: Basa hai (बसा है)
  pronunciation: Bus-aa hai
  meaning: Has resided, has settled. Similar to 'bas gaya' but in a continuous present
    perfect tense.
- word: Khoya khoya sa (खोया खोया सा)
  pronunciation: Kho-yaa kho-yaa saa
  meaning: Lost, absent-minded, dreamy. Describes a state of being engrossed or distracted
    by thoughts.
- word: Rehta hoon (रहता हूँ)
  pronunciation: Reh-taa hoo
  meaning: I remain, I stay, I live. Indicates a continuous state or action.
- word: Zindagi (ज़िंदगी)
  pronunciation: Zin-duh-gee
  meaning: Life. The general term for existence.
- word: Khushi (ख़ुशी)
  pronunciation: Khoo-shee
  meaning: Happiness, joy. A state of well-being and contentment.
- word: Roop (रूप)
  pronunciation: Roo-p
  meaning: Beauty, form, appearance. Often refers to physical attractiveness.
- word: Rani (रानी)
  pronunciation: Raa-nee
  meaning: Queen. A female monarch or a term of endearment for a beloved woman.
- word: Saagar (सागर)
  pronunciation: Saa-gur
  meaning: Ocean, sea. Metaphorically, a vast quantity or source of something.
- word: Reh paoon (रह पाऊँ)
  pronunciation: Reh paa-oo
  meaning: Be able to live/stay. Expresses capability or possibility of continuing
    to exist or remain.
- word: Saathiya (साथिया)
  pronunciation: Saa-thee-yaa
  meaning: Companion, beloved, partner. An affectionate term for someone close.
- word: Jeena (जीना)
  pronunciation: Jee-naa
  meaning: To live, living. The act of existing or experiencing life.
