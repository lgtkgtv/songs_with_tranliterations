title: Kora Kagaz Tha Yeh Man Mera
movie: Aradhana
year: '1969'
singers: Lata Mangeshkar, Kishore Kumar
lyricist: Anand Bakshi
composer: S.D. Burman
theme: This romantic duet describes a heart that was once like a blank page, now filled
  with the beloved's name and love. It expresses the joy of new love, the fear of
  losing it, and the comfort found in a partner's presence.
lyrics:
- roman: Kora kaagaz tha yeh man mera
  devanagari: कोरा कागज़ था ये मन मेरा
  english: My heart was a blank paper
- roman: Likh diya naam is mein tera
  devanagari: लिख दिया नाम इसमें तेरा
  english: I wrote your name in it
- roman: Soona aangan tha jeevan mera
  devanagari: सूना आँगन था जीवन मेरा
