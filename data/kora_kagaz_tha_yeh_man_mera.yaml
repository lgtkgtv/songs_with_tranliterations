title: Kora Kagaz Tha Yeh Man Mera
movie: Aradhana
year: '1969'
singers: Lata Mangeshkar, Kishore Kumar
actors:
- Rajesh Khanna
- Sharmila Tagore
composer: S.D. Burman
lyricist: Anand Bakshi
youtube_channel: Saregama Music
resolution: 4K
theme: The song beautifully expresses the transformative power of love. It uses metaphors
  of a "blank paper" heart and an "empty courtyard" life, which become filled and
  vibrant with the arrival of a beloved's name and love, signifying a new beginning
  and profound emotional connection.
