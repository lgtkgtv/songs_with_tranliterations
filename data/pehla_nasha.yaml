vocabulary:
   - word: "Pehla (पहला)"
     pronunciation: "peh-la"
     meaning: "First. Refers to the initial or maiden experience of something, in this context, love."
   - word: "Nasha (नशा)"
     pronunciation: "na-sha"
     meaning: "Intoxication, a spell, a trance. Here, it denotes the heady, enchanting feeling of first love, akin to being under a magical influence."
   - word: "Khumaar (खुमार)"
     pronunciation: "khu-maar"
     meaning: "A lingering pleasant daze or intoxication; a 'high'. It signifies the persistent, blissful feeling that follows the initial intoxication of love."
   - word: "Naya (नया)"
     pronunciation: "na-ya"
     meaning: "New, fresh. Emphasizing the novel and unexplored nature of the emotions."
   - word: "Pyaar (प्यार)"
     pronunciation: "pyaar"
     meaning: "Love."
   - word: "Intezaar (इंतज़ार)"
     pronunciation: "in-te-zaar"
     meaning: "Wait, anticipation. Here, the eager and hopeful waiting for the developments of new love."
   - word: "Haal (हाल)"
     pronunciation: "haal"
     meaning: "Condition, state, situation. 'Apna haal' means 'my own state/condition'."
   - word: "Aye (ऐ)"
     pronunciation: "ai"
     meaning: "Oh, O (an interjection used to address someone or something, often with emotion)."
   - word: "Dil-e-bekaraar (दिल-ए-बेकरार)"
     pronunciation: "dil-e-be-ka-raar"
     meaning: "Restless heart. 'Dil' (heart) + '-e-' (a Persian conjunction meaning 'of') + 'bekaraar' (restless, uneasy, impatient)."
   - word: "Bata (बता)"
     pronunciation: "ba-ta"
     meaning: "Tell (informal imperative form of 'batana')."
   - word: "Udta hi phiroon (उड़ता ही फिरूँ)"
     pronunciation: "ud-ta hee fi-roon"
     meaning: "Should I keep flying? 'Udna' (to fly), 'phirna' (to wander, to keep doing something)."
   - word: "Hawaaon (हवाओं)"
     pronunciation: "ha-vaa-on"
     meaning: "Winds, air (plural of 'hawa'). Poetic for the atmosphere or surroundings."
   - word: "Kahin (कहीं)"
     pronunciation: "ka-heen"
     meaning: "Somewhere, anywhere."
   - word: "Jhoom jaaun (झूम जाऊँ)"
     pronunciation: "jhoom jaa-oon"
     meaning: "Should I sway/dance? 'Jhoomna' (to sway, to dance, to be ecstatic)."
   - word: "Ghataayon (घटाओं)"
     pronunciation: "gha-taa-on"
     meaning: "Clouds (plural of 'ghata'). Often used poetically for dark, sometimes rain-bearing, clouds."
   - word: "Bekasi (बेकसी)"
     pronunciation: "be-ka-si"
     meaning: "Helplessness, forlornness, a state of being alone and vulnerable yet consumed by emotion."
   - word: "Ghuli (घुली)"
     pronunciation: "ghu-lee"
     meaning: "Dissolved, mingled (feminine past participle of 'ghulna' - to dissolve)."
   - word: "Bekhudi (बेखुदी)"
     pronunciation: "be-khu-dee"
     meaning: "Self-forgetfulness, ecstasy, oblivion. A state where one forgets oneself due to intense emotion, losing sense of surroundings."
   - word: "Roka nahin (रोका नहीं)"
     pronunciation: "ro-ka na-heen"
     meaning: "Did not stop (it). Expressing a lack of resistance to the overwhelming feelings."
   - word: "Khwaabon (ख्वाबों)"
     pronunciation: "khwaa-bon"
     meaning: "Dreams (plural of 'khwaab')."
   - word: "Honthon (होंठों)"
     pronunciation: "hon-thon"
     meaning: "Lips (plural of 'honth')."
   - word: "Baahon (बाँहों)"
     pronunciation: "baa-hon"
     meaning: "Arms, embrace (plural of 'baanh')."
   - word: "Palkon (पलकों)"
     pronunciation: "pal-kon"
     meaning: "Eyelids, eyelashes (plural of 'palk')."
   - word: "Haseen (हसीन)"
     pronunciation: "ha-seen"
     meaning: "Beautiful, lovely."
   - word: "Dil-nasheen (दिल-नशीं)"
     pronunciation: "dil-na-sheen"
     meaning: "Heart-dwelling, enchanting, captivating. 'Dil' (heart) + 'nasheen' (seated, residing). Someone who resides in the heart."
   - word: "Simat ke (सिमट के)"
     pronunciation: "si-mat ke"
     meaning: "Shrinking, curling up, gathering oneself. Here, metaphorically, to confine oneself or to recede. 'Na ja tu simat ke' means 'Don't just remain confined to my dreams, become real'."