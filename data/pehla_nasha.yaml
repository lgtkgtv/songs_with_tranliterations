theme: "This song beautifully captures the exhilarating and tender emotions of experiencing first love. It describes the world feeling fresh and new, with every moment imbued with a magical, intoxicating quality, as the lover is completely lost in the enchanting spell of their beloved."
lyrics:
   - roman: "Pehla nasha, pehla khumaar"
     devanagari: "पहला नशा, पहला खुमार"
     english: "First intoxication, first daze"
   - roman: "Naya pyaar hai, naya intezaar"
     devanagari: "नया प्यार है, नया इंतज़ार"
     english: "It's a new love, a new anticipation"
   - roman: "Kar loon main kya apna haal"
     devanagari: "कर लूँ मैं क्या अपना हाल"
     english: "What should I do about my condition?"
   - roman: "Aye dil-e-bekaraar"
     devanagari: "ऐ दिल-ए-बेकरार"
     english: "O restless heart"
   - roman: "Mere dil-e-bekaraar"
     devanagari: "मेरे दिल-ए-बेकरार"
     english: "My restless heart"
   - roman: "Tu hi bata"
