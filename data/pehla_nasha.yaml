title: "Pehla Nasha"
movie: "Jo Jeeta Wohi Sikandar"
year: 1992
singers: "Udit Narayan, Sadhana Sargam"
lyricist: "Majrooh Sultanpuri"
composer: "Jatin-Lalit"
