vocabulary:
- word: Deewana
  pronunciation: dee-waa-naa
  meaning: Mad, crazy, infatuated; often used poetically to describe someone deeply
    in love or obsessed.
- word: Baadal
  pronunciation: baa-dal
  meaning: Cloud.
- word: Saawan
  pronunciation: saa-wan
  meaning: Monsoon; specifically, the Hindu month of Shraavana, known for heavy rains
    and lush greenery, symbolizing romance and new beginnings.
- word: Ghata
  pronunciation: gha-taa
  meaning: Cloud, dark cloud, a mass of clouds; often associated with the monsoon
    season.
- word: Chhaayi
  pronunciation: chhaa-yee
  meaning: Spread, covered, overcast; past tense of 'chhaana' (to spread/cover).
- word: Jhooma
  pronunciation: jhoo-maa
  meaning: Swayed, danced (with joy or emotion); past tense of 'jhoomna' (to sway,
    to dance joyfully).
- word: Angdaayi
  pronunciation: ang-daa-yee
  meaning: A stretch, a yawn; in this context, it metaphorically means love awakening
    or stretching its influence, coming to life.
- word: Naghma
  pronunciation: nagh-maa
  meaning: Melody, tune, song; a musical composition.
- word: Nikhar jaaye
  pronunciation: ni-khar jaa-ye
  meaning: Become more beautiful, shine, enhance; to be refined or made more radiant.
- word: Rangeen
  pronunciation: ran-geen
  meaning: Colorful, vibrant.
- word: Fiza
  pronunciation: fi-zaa
  meaning: Atmosphere, environment, weather; often used to describe the general mood
    or ambiance of a place.
- word: Sitaare
  pronunciation: si-taa-re
  meaning: Stars (plural of 'sitaara').
- word: Ishaaraao
  pronunciation: i-shaa-raa-o
  meaning: Gestures, signs (plural of 'ishaara').
- word: Dhadkan
  pronunciation: dhad-kan
  meaning: Heartbeat, pulse.
- word: Sharmaayi
  pronunciation: shar-maa-yee
  meaning: Felt shy, hesitated; past tense of 'sharmaana' (to feel shy).
- word: Armaan
  pronunciation: ar-maan
  meaning: Desire, wish, longing, aspiration.
- word: Baahon
  pronunciation: baa-hoñ
  meaning: Arms (plural of 'baah').
- word: Matlab
  pronunciation: mat-lab
  meaning: Meaning, purpose, significance.
- word: Tanha
  pronunciation: tan-haa
  meaning: Lonely, solitary, alone.
- word: Raahon
  pronunciation: raa-hoñ
  meaning: Paths, ways (plural of 'raah').
- word: Nikloon
  pronunciation: nik-looñ
  meaning: I go out, I emerge (from 'nikalna' - to come out, to leave).
