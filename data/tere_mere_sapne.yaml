title: "Tere Mere Sapne"
movie: "Guide"
year: 1965
singers: "Mohammed Rafi, Lata Mangeshkar"
lyricist: "Shailendra"
composer: "S.D. Burman"
youtube_id: "j7TM2ccOGbU"
theme: "This melancholic yet hopeful duet expresses the deep emotional connection and shared aspirations between two lovers. They envision a future where their dreams merge into one, symbolizing unity, enduring companionship, and a desire to navigate life's journey together through all its highs and lows."
lyrics:
   - roman: "Ho tere mere sapne ab ek rang hain"
     devanagari: "हो तेरे मेरे सपने अब एक रंग हैं"
     english: "Oh, your and my dreams are now of one color."
   - roman: "Ho jahan rang hai, jahan rang hai"
     devanagari: "हो जहाँ रंग है, जहाँ रंग है"
     english: "Oh, where there is color, where there is color."
