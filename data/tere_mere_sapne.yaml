vocabulary:
   - word: "sapne"
     pronunciation: "sup-ney"
     meaning: "Dreams. Here, it refers to aspirations, hopes, and visions for the future."
   - word: "ek rang"
     pronunciation: "ek rung"
     meaning: "One color. A metaphorical expression signifying unity, shared purpose, identical nature, or harmony."
   - word: "jahan"
     pronunciation: "ja-haan"
     meaning: "Where. In this context, it is used to emphasize the presence of 'color' (i.e., joy, vibrancy, shared dreams)."
   - word: "ek dooje se"
     pronunciation: "ek doo-jey sey"
     meaning: "Each other; one another."
   - word: "kitne saalon mein"
     pronunciation: "kit-ney saa-lon mein"
     meaning: "After so many years; implying a long time or a fated reunion."
   - word: "badan"
     pronunciation: "buh-dun"
     meaning: "Body; often used poetically to refer to physical beings or entities."
   - word: "baadalon"
     pronunciation: "baa-duh-lon"
     meaning: "Clouds. Here, it signifies the merging or coming together of entities, like clouds joining in the sky."
   - word: "mohabbat"
     pronunciation: "moh-huh-but"
     meaning: "Love; deep affection."
   - word: "siwa"
     pronunciation: "see-wa"
     meaning: "Except; other than; besides."
   - word: "gham"
     pronunciation: "ghum"
     meaning: "Sorrow; grief; sadness. Implies a past full of hardship or loneliness."
   - word: "mila nahin"
     pronunciation: "milaa na-heen"
     meaning: "Did not find/receive. Here, 'was not found'."
   - word: "chandan"
     pronunciation: "chun-dun"
     meaning: "Sandalwood. Valued for its fragrance and smoothness; often used metaphorically to describe something beautiful, pure, or soothing (like skin)."
   - word: "badan"
     pronunciation: "buh-dun"
     meaning: "Body. See above."
   - word: "chanchal"
     pronunciation: "chun-chul"
     meaning: "Restless; playful; fickle; lively. Often used for eyes or movements."
   - word: "chitwan"
     pronunciation: "chit-wun"
     meaning: "Gaze; glance; appearance. Often a poetic term for the way someone looks."
   - word: "madhur"
     pronunciation: "muh-dhoor"
     meaning: "Sweet; melodious; pleasant."
   - word: "milan"
     pronunciation: "mi-lun"
     meaning: "Meeting; union; coming together. Here, an intimate coming together."
   - word: "jeevan saathi"
     pronunciation: "jee-vun saa-thee"
     meaning: "Life partner; soulmate; companion for life."
   - word: "deep aur baati"
     pronunciation: "deep or baa-tee"
     meaning: "Lamp and wick. A common idiom in Hindi to describe two things that are inseparable, interdependent, and essential to each other's existence (like a lamp needs a wick to burn)."
   - word: "humsafar"
     pronunciation: "hum-suh-fur"
     meaning: "Companion; fellow traveler; someone who journeys with you."
   - word: "zindagi"
     pronunciation: "zin-duh-gee"
     meaning: "Life."