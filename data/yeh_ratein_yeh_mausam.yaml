title: Yeh Ratein Yeh Mausam
movie: Dilli Ka Thug
year: '1958'
singers: Asha Bhosle, Kishore Kumar
actors:
- Nutan
- Kishore Kumar
composer: O.P. Nayyar
lyricist: Majrooh Sultanpuri
youtube_channel: Saregama Music
resolution: Unknown
theme: This song is a romantic duet that celebrates the intoxicating joy of love set
  against the backdrop of a beautiful natural night scene. It speaks of two hearts
  committing to an eternal bond, finding immense pleasure and a new meaning to life
  in each other's company.
lyrics:
- roman: Yeh ratein yeh mausam, nadi ka kinara, yeh chanchal hawa
  devanagari: यह रातें यह मौसम, नदी का किनारा, यह चंचल हवा
  english: These nights, this weather, the river bank, this playful breeze
- roman: Kaha do dilon ne, ke milkar rahenge, kabhi na honge juda
  devanagari: कहा दो दिलों ने, के मिलकर रहेंगे, कभी ना होंगे जुदा
  english: Two hearts have said that they will stay together, never to be separated
- roman: Yeh ratein yeh mausam, nadi ka kinara, yeh chanchal hawa
  devanagari: यह रातें यह मौसम, नदी का किनारा, यह चंचल हवा
  english: These nights, this weather, the river bank, this playful breeze
- roman: Kaha do dilon ne, ke milkar rahenge, kabhi na honge juda
  devanagari: कहा दो दिलों ने, के मिलकर रहेंगे, कभी ना होंगे जुदा
  english: Two hearts have said that they will stay together, never to be separated
- roman: Yeh ratein yeh mausam...
  devanagari: यह रातें यह मौसम...
  english: These nights, this weather...
- roman: Yeh kya baat hai, aaj ki chandani mein
  devanagari: यह क्या बात है, आज की चांदनी में
  english: What is this special thing, in today's moonlight?
- roman: Ke hum kho gaye, pyar ki ragini mein
  devanagari: के हम खो गए, प्यार की रागिनी में
  english: That we are lost, in the melody of love
- roman: Yeh bahon mein bahen, yeh bahki nigahen
  devanagari: यह बाहों में बाहें, यह बहकी निगाहें
  english: These arms in arms, these wandering gazes
- roman: Lo aane laga, zindagi ka maza
  devanagari: लो आने लगा, जिंदगी का मज़ा
  english: Oh, the joy of life has begun to come
- roman: Kaha do dilon ne, ke milkar rahenge, kabhi na honge juda
  devanagari: कहा दो दिलों ने, के मिलकर रहेंगे, कभी ना होंगे जुदा
