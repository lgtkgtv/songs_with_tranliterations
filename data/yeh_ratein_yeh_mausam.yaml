- roman: Zara dekhiye to, idhar muskurake
  devanagari: ज़रा देखिए तो, इधर मुस्कुराके
  english: Just look this way, with a smile
- roman: Naye phool dil mein, khile jagmagake
  devanagari: नए फूल दिल में, खिले जगमगाके
