title: Yeh Ratein Yeh Mausam
movie: Dilli Ka Thug
year: '1958'
singers: Asha Bhosle, Kishore Kumar
actors:
- Nutan
- Kishore Kumar
composer: O.P. Nayyar
lyricist: Majrooh Sultanpuri
youtube_channel: Shemaroo Filmi Gaane
resolution: Unknown
theme: This song describes a romantic setting by a riverbank under the moonlight,
  where two lovers express their commitment to stay together forever. It captures
  the joy and deep affection between them amidst a beautiful, enchanting natural backdrop.
lyrics:
- roman: Yeh raatein yeh mausam, nadi ka kinaara, yeh chanchal hawa
  devanagari: ये रातें ये मौसम, नदी का किनारा, ये चंचल हवा
  english: These nights, these seasons, the river's bank, this playful breeze
- roman: Kaha do dilon ne, ke milkar rahenge, kabhi na honge judaa
  devanagari: कहा दो दिलों ने, के मिलकर रहेंगे, कभी ना होंगे जुदा
  english: Two hearts have said that they will stay together, never to be separated
- roman: Yeh raatein yeh mausam, nadi ka kinaara, yeh chanchal hawa
  devanagari: ये रातें ये मौसम, नदी का किनारा, ये चंचल हवा
  english: These nights, these seasons, the river's bank, this playful breeze
- roman: Yeh kya baat hai, aaj ki chandani mein
  devanagari: ये क्या बात है, आज की चांदनी में
  english: What is this special thing, in today's moonlight?
- roman: Ke hum kho gaye, pyaar ki raagini mein
  devanagari: के हम खो गए, प्यार की रागिनी में
  english: That we are lost, in the melody of love
- roman: Yeh baahon mein aakar, tera muskuraana
  devanagari: ये बाहों में आकर, तेरा मुस्कुराना
  english: Your smiling, coming into my arms
- roman: Ghazab dha gaya, dil ko tadpa gaya
  devanagari: गज़ब ढा गया, दिल को तड़पा गया
  english: It has wreaked havoc, it has made my heart yearn
- roman: Yeh raatein yeh mausam, nadi ka kinaara, yeh chanchal hawa
  devanagari: ये रातें ये मौसम, नदी का किनारा, ये चंचल हवा
  english: These nights, these seasons, the river's bank, this playful breeze
- roman: Sama hai suhaana, na tum ho paraaye
  devanagari: समा है सुहाना, ना तुम हो पराए
  english: The atmosphere is pleasant, and you are not a stranger
- roman: Chale aaoge, ab na jaana kahin pe
  devanagari: चले आओगे, अब ना जाना कहीं पे
  english: You will come, now don't go anywhere
- roman: Yeh nazron se nazrein, milakar milaana
  devanagari: ये नज़रों से नज़रे, मिलाकर मिलाना
  english: This meeting of eyes, by joining them
- roman: Ghazab dha gaya, dil ko tadpa gaya
  devanagari: गज़ब ढा गया, दिल को तड़पा गया
  english: It has wreaked havoc, it has made my heart yearn
- roman: Yeh raatein yeh mausam, nadi ka kinaara, yeh chanchal hawa
  devanagari: ये रातें ये मौसम, नदी का किनारा, ये चंचल हवा
  english: These nights, these seasons, the river's bank, this playful breeze
- roman: Yeh chanda sitaare, yeh saare nazaare
  devanagari: ये चंदा सितारे, ये सारे नज़ारे
  english: These moon and stars, these all sights
- roman: Gawaahi denge, humaare pyaar ke
  devanagari: गवाही देंगे, हमारे प्यार के
  english: Will bear witness, to our love
- roman: Yeh kasmein yeh vaade, nibhaayenge hum toh
  devanagari: ये कसमें ये वादे, निभाएंगे हम तो
  english: These oaths, these promises, we will fulfill
- roman: Kabhi na honge judaa, kabhi na honge judaa
  devanagari: कभी ना होंगे जुदा, कभी ना होंगे जुदा
  english: Never will we be separated, never will we be separated
- roman: Yeh raatein yeh mausam, nadi ka kinaara, yeh chanchal hawa
  devanagari: ये रातें ये मौसम, नदी का किनारा, ये चंचल हवा
  english: These nights, these seasons, the river's bank, this playful breeze
- roman: Kaha do dilon ne, ke milkar rahenge, kabhi na honge judaa
  devanagari: कहा दो दिलों ने, के मिलकर रहेंगे, कभी ना होंगे जुदा
  english: Two hearts have said that they will stay together, never to be separated
