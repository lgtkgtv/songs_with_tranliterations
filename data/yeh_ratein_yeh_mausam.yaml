title: Yeh Ratein Yeh Mausam
movie: Dilli Ka Thug
year: '1958'
singers: Asha Bhosle, Kishore Kumar
actors:
- Nutan
- Kishore Kumar
composer: O. P. Nayyar
lyricist: Majrooh Sultanpuri
youtube_channel: Shemaroo Filmi Gaane
resolution: 1080p HD
theme: This is a classic romantic duet set against the backdrop of a beautiful night
  by a river. The song expresses the joy and unwavering commitment of two lovers who
  promise to stay together forever, celebrating their profound connection under the
  enchanting moonlight and stars.
lyrics:
- section_name: Chorus 1
  lines:
  - roman: Yeh raatein yeh mausam, nadee ka kinaara, yeh chanchal hawa
    devanagari: ये रातें ये मौसम, नदी का किनारा, ये चंचल हवा
    english: These nights, these seasons, the river bank, this playful breeze,
    is_repeat: false
  - roman: Kaha do dilon ne, ke milkar kabhi hum na honge judaa
    devanagari: कहा दो दिलों ने, कि मिलकर कभी हम न होंगे जुदा
    english: Two hearts have said that, meeting, we will never be separated.
    is_repeat: false
  - roman: Yeh raatein yeh mausam, nadee ka kinaara, yeh chanchal hawa
    devanagari: ये रातें ये मौसम, नदी का किनारा, ये चंचल हवा
    english: These nights, these seasons, the river bank, this playful breeze.
    is_repeat: true
- section_name: Verse 1
  lines:
  - roman: Yeh kya baat hai aaj ki chandni mein
    devanagari: ये क्या बात है आज की चाँदनी में
    english: What is this special thing in today's moonlight?
    is_repeat: false
  - roman: Ke hum kho gaye pyaar ki raagini mein
    devanagari: कि हम खो गए प्यार की रागिनी में
    english: That we are lost in the melody of love.
    is_repeat: false
  - roman: Sunaa rahi hai fiza, geet koi
    devanagari: सुना रही है फ़िज़ा, गीत कोई
    english: The atmosphere is singing some song,
    is_repeat: false
  - roman: Jise sunke jaage hain armaan kai
    devanagari: जिसे सुनके जागे हैं अरमान कई
    english: Hearing which, many desires have awakened.
    is_repeat: false
- section_name: Chorus 2
  lines:
  - roman: Kaha do dilon ne, ke milkar kabhi hum na honge judaa
    devanagari: कहा दो दिलों ने, कि मिलकर कभी हम न होंगे जुदा
    english: Two hearts have said that, meeting, we will never be separated.
    is_repeat: true
  - roman: Yeh raatein yeh mausam, nadee ka kinaara, yeh chanchal hawa
    devanagari: ये रातें ये मौसम, नदी का किनारा, ये चंचल हवा
    english: These nights, these seasons, the river bank, this playful breeze.
    is_repeat: true
- section_name: Verse 2
  lines:
  - roman: Sitaron ki mehfil ne karke ishaara
    devanagari: सितारों की महफ़िल ने करके इशारा
    english: The gathering of stars, by making a sign,
    is_repeat: false
  - roman: Kaha ab to saara jahaan hai tumhara
    devanagari: कहा अब तो सारा जहाँ है तुम्हारा
    english: Said, "Now the whole world is yours."
    is_repeat: false
  - roman: Mohabbat jawan ho, khula aasmaan ho
    devanagari: मोहब्बत जवाँ हो, खुला आसमान हो
    english: May love be young, may the sky be open,
    is_repeat: false
  - roman: Kare koi dil aarzoo aur kya
    devanagari: करे कोई दिल आरज़ू और क्या
    english: What more could any heart desire?
    is_repeat: false
- section_name: Chorus 3
  lines:
  - roman: Kaha do dilon ne, ke milkar kabhi hum na honge judaa
    devanagari: कहा दो दिलों ने, कि मिलकर कभी हम न होंगे जुदा
    english: Two hearts have said that, meeting, we will never be separated.
    is_repeat: true
  - roman: Yeh raatein yeh mausam, nadee ka kinaara, yeh chanchal hawa
    devanagari: ये रातें ये मौसम, नदी का किनारा, ये चंचल हवा
    english: These nights, these seasons, the river bank, this playful breeze.
    is_repeat: true
- section_name: Verse 3
  lines:
  - roman: Kasam hai tumhe tum agar mujhse roothe
    devanagari: कसम है तुम्हें तुम अगर मुझसे रूठे
    english: I swear to you, if you get upset with me,
    is_repeat: false
  - roman: Rahe saans jab tak yeh bandhan na toote
    devanagari: रहे साँस जब तक ये बंधन न टूटे
    english: May this bond not break as long as there is breath.
    is_repeat: false
  - roman: Tumhe dil diya hai, yeh waada kiya hai
    devanagari: तुम्हें दिल दिया है, ये वादा किया है
    english: I have given you my heart, I have made this promise,
    is_repeat: false
  - roman: Sanam main tumhari rahungi sada
    devanagari: सनम मैं तुम्हारी रहूँगी सदा
    english: My beloved, I will always be yours.
    is_repeat: false
- section_name: Chorus 4
  lines:
  - roman: Kaha do dilon ne, ke milkar kabhi hum na honge judaa
    devanagari: कहा दो दिलों ने, कि मिलकर कभी हम न होंगे जुदा
    english: Two hearts have said that, meeting, we will never be separated.
    is_repeat: true
  - roman: Yeh raatein yeh mausam, nadee ka kinaara, yeh chanchal hawa
