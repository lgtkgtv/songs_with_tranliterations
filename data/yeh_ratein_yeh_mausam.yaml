- roman: Yeh ratein yeh mausam...
  devanagari: यह रातें यह मौसम...
  english: These nights, this weather...
- roman: Samaa hai mohabbat ka, aao mere saathiyon
  devanagari: समां है मोहब्बत का, आओ मेरे साथियों
  english: It's a moment of love, come my companions
- roman: Meri zindagi, tum hi ho ab to
  devanagari: मेरी जिंदगी, तुम ही हो अब तो
  english: My life, you are the only one now
- roman: Yeh dharti, yeh nadiya, yeh neela gagan
  devanagari: यह धरती, यह नदियां, यह नीला गगन
  english: This earth, these rivers, this blue sky
- roman: Sabhi poochhte hain, kahan hai sanam
  devanagari: सभी पूछते हैं, कहां है सनम
  english: All are asking, where is my beloved?
- roman: Kaha do dilon ne, ke milkar rahenge, kabhi na honge juda
  devanagari: कहा दो दिलों ने, के मिलकर रहेंगे, कभी ना होंगे जुदा
