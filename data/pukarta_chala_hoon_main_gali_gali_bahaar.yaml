vocabulary:
- word: Pukarta
  pronunciation: Poo-kaar-taa
  meaning: Calling out, shouting, beckoning.
- word: Chala hoon main
  pronunciation: Cha-laa hoon main
  meaning: I have been walking/going, I continue to walk/go.
- word: Gali gali
  pronunciation: Ga-lee ga-lee
  meaning: Street by street, every street, throughout the streets.
- word: Bahaar
  pronunciation: Ba-haar
  meaning: Spring, bloom, beauty, the essence or freshness of spring.
- word: Chup si shaam
  pronunciation: Chup see shaam
  meaning: A quiet/silent evening; 'chup' means silent, 'si' is like, 'shaam' is evening.
- word: Rang
  pronunciation: Rung
  meaning: Color.
- word: Roop
  pronunciation: Roop
  meaning: Form, appearance, beauty.
- word: Chaandni
  pronunciation: Chaand-nee
  meaning: Moonlight.
- word: Dhoop
  pronunciation: Dhoop
  meaning: Sunlight.
- word: Bani hui hai
  pronunciation: Ba-nee hoo-ee hai
  meaning: Is made, has become, is formed.
- word: Har ghadi
  pronunciation: Har gha-dee
  meaning: Every moment, constantly.
- word: Khayaal
  pronunciation: Kha-yaal
  meaning: Thought, idea, imagination.
- word: Gham
  pronunciation: Ghum
  meaning: Sorrow, sadness, grief.
- word: Ruka
  pronunciation: Roo-kaa
  meaning: Stopped, paused (past tense of 'rukna').
- word: Talaash
  pronunciation: Ta-laash
  meaning: Search, quest, pursuit.
- word: Haseen
  pronunciation: Ha-seen
  meaning: Beautiful, lovely, charming.
- word: Yaar
  pronunciation: Yaar
  meaning: Beloved, lover, friend (in this romantic context, it refers to a beloved).
