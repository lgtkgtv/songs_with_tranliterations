title: Pukarta Chala Hoon Main Gali Gali Bahaar
movie: Mere Sanam
year: '1965'
singers: Mohammed Rafi
actors:
- Joy Mukherjee
- Asha Parekh
composer: O P Nayyar
lyricist: Majrooh Sultanpuri
youtube_channel: Shemaroo Filmi Gaane
resolution: 1080p
theme: The song expresses the protagonist's relentless search for his beloved, wandering
  through streets filled with the essence of spring. It conveys a sense of longing
  and a quiet, melancholic anticipation, where every moment is consumed by the thought
  of his love, and every sorrowful place seems to hold a clue to her whereabouts.
lyrics:
- section_name: Chorus
  lines:
  - roman: Pukarta chala hoon main, gali gali bahaar ki
    devanagari: पुकारता चला हूँ मैं, गली गली बहार की
    english: I have been calling out, street by street, for spring's essence.
    is_repeat: false
  - roman: Pukarta chala hoon main, gali gali bahaar ki
    devanagari: पुकारता चला हूँ मैं, गली गली बहार की
    english: I have been calling out, street by street, for spring's essence.
    is_repeat: true
  - roman: Bas ek chup si shaam hai, kuch aur hai na pyaar ki
    devanagari: बस एक चुप सी शाम है, कुछ और है न प्यार की
    english: It's just a silent evening, there's nothing else of love.
