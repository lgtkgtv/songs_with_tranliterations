vocabulary:
- word: Nisar
  pronunciation: ni-saar
  meaning: To sacrifice, to dedicate completely; to be devoted to.
- word: Udhar
  pronunciation: oo-dhaar
  meaning: Loan, credit; here, metaphorically 'to take on' or 'borrow' someone's pain.
- word: Vaste
  pronunciation: vaas-te
  meaning: For the sake of, for; on behalf of.
- word: Fakeer
  pronunciation: fa-keer
  meaning: A mendicant, a poor person; often used metaphorically for someone lacking
    material wealth but rich in spirit.
- word: Ameer
  pronunciation: a-meer
  meaning: Rich, wealthy; here, 'rich at heart'.
- word: Mite
  pronunciation: mi-te
  meaning: To be erased, to be destroyed, to end; here, 'that which is dedicated'
    or 'sacrificed'.
- word: Aman
  pronunciation: a-man
  meaning: Peace, tranquility.
- word: Roshni
  pronunciation: rosh-nee
  meaning: Light, brightness.
- word: Anmol
  pronunciation: an-mol
  meaning: Priceless, invaluable, precious.
- word: Khoon ke rishte
  pronunciation: khoon ke rish-te
  meaning: Blood relations, family ties.
- word: Pi gaya
  pronunciation: pee ga-ya
  meaning: Drank; here, metaphorically 'endured' or 'swallowed' (tears/sorrow).
- word: Gham
  pronunciation: gham
  meaning: Sorrow, grief, sadness.
- word: Seh gaya
  pronunciation: seh ga-ya
  meaning: Endured, tolerated, bore (pain or difficulty).
