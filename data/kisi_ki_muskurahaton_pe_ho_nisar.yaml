title: Kisi Ki Muskurahaton Pe Ho Nisar
movie: Anari
year: '1959'
singers: Mukesh
actors:
- Raj Kapoor
composer: Shankar-Jaikishan
lyricist: Shailendra
youtube_channel: Saregama Music
resolution: HD
theme: This song advocates a philosophy of selfless living, emphasizing finding joy
  in the happiness of others and dedicating one's life to humanity. It encourages
  compassion, kindness, and enduring personal struggles for the greater good, defining
  a meaningful life through altruism.
lyrics:
- section_name: Chorus 1
  lines:
  - roman: Kisi ki muskurahaton pe ho nisar
    devanagari: किसी की मुस्कुराहटों पे हो निसार
    english: May you sacrifice yourself for someone's smiles,
    is_repeat: false
  - roman: Kisi ka dard mil sake to le udhar
    devanagari: किसी का दर्द मिल सके तो ले उधार
    english: If you can get someone's pain, take it as a loan.
    is_repeat: false
  - roman: Kisi ke vaste ho tere dil mein pyar
    devanagari: किसी के वास्ते हो तेरे दिल में प्यार
    english: May there be love in your heart for someone,
    is_repeat: false
  - roman: Jeena isi ka naam hai
    devanagari: जीना इसी का नाम है
    english: This is what living is called.
    is_repeat: false
- section_name: Verse 1
  lines:
  - roman: Mana apni jeb se fakeer hain
    devanagari: माना अपनी जेब से फ़कीर हैं
    english: Agreed, we are poor from our pockets,
    is_repeat: false
  - roman: Phir bhi yaron dil ke hum ameer hain
    devanagari: फिर भी यारों दिल के हम अमीर हैं
    english: Still, friends, we are rich at heart.
    is_repeat: false
  - roman: Mite jo pyar ke liye woh zindagi
    devanagari: मिटे जो प्यार के लिए वो ज़िंदगी
    english: That life which is erased for love,
    is_repeat: false
  - roman: Jale jo aman ke liye woh roshni
    devanagari: जले जो अमन के लिए वो रोशनी
    english: That light which burns for peace.
    is_repeat: false
- section_name: Chorus 2
  lines:
  - roman: Kisi ke vaste ho tere dil mein pyar
    devanagari: किसी के वास्ते हो तेरे दिल में प्यार
    english: May there be love in your heart for someone,
    is_repeat: true
  - roman: Jeena isi ka naam hai
    devanagari: जीना इसी का नाम है
    english: This is what living is called.
    is_repeat: true
- section_name: Verse 2
  lines:
  - roman: Bade anmol hain ye khoon ke rishte
    devanagari: बड़े अनमोल हैं ये ख़ून के रिश्ते
    english: These blood relations are very precious.
    is_repeat: false
  - roman: Inko tu pyar se jo de sake to de
    devanagari: इनको तू प्यार से जो दे सके तो दे
    english: If you can give them love, then give it.
    is_repeat: false
- section_name: Chorus 3
  lines:
  - roman: Kisi ke vaste ho tere dil mein pyar
    devanagari: किसी के वास्ते हो तेरे दिल में प्यार
    english: May there be love in your heart for someone,
    is_repeat: true
  - roman: Jeena isi ka naam hai
    devanagari: जीना इसी का नाम है
    english: This is what living is called.
    is_repeat: true
- section_name: Verse 3
  lines:
  - roman: Jo ansu pi gaya woh zindagi
    devanagari: जो आँसू पी गया वो ज़िंदगी
    english: That life which drank tears (endured sorrow),
    is_repeat: false
  - roman: Jo gham ko seh gaya woh zindagi
    devanagari: जो ग़म को सह गया वो ज़िंदगी
    english: That life which endured sorrow.
    is_repeat: false
- section_name: Chorus 4
  lines:
