vocabulary:
- word: mahake
  pronunciation: mah-ke
  meaning: fragrant, perfumed. Here, it implies secrets that are pleasant or alluring.
- word: raaz
  pronunciation: raaz
  meaning: secret.
- word: khoobsoorat
  pronunciation: khoob-soo-rat
  meaning: beautiful.
- word: andaaz
  pronunciation: an-daaz
  meaning: style, manner, demeanor, way.
- word: lab
  pronunciation: lab
  meaning: lips. (Poetic term for 'honth')
- word: hile
  pronunciation: hi-le
  meaning: moved, stirred.
- word: mogare
  pronunciation: mo-ga-re
  meaning: jasmine (specifically, Arabian jasmine).
- word: khilte hain
  pronunciation: khil-te hain
  meaning: bloom, blossom.
- word: saahil
  pronunciation: saa-hil
  meaning: shore, coast, bank. Metaphorically, it could mean boundaries or meeting
    points.
- word: khaamoshiyon
  pronunciation: khaa-mo-shi-yon
  meaning: silences (plural of khaamoshi).
- word: aawaaz
  pronunciation: aa-waaz
  meaning: voice, sound.
- word: narm
  pronunciation: narm
  meaning: soft, gentle.
- word: sargam
  pronunciation: sar-gam
  meaning: 'musical scale, melody (specifically, the Indian equivalent of solfège:
    Sa, Re, Ga, Ma).'
- word: palkon
  pronunciation: pal-kon
  meaning: eyelids (plural of palak).
- word: saaye
  pronunciation: saa-ye
  meaning: shadow, shade (plural of saaya).
- word: chhupi
  pronunciation: chhu-pi
  meaning: hidden.
- word: shabnam
  pronunciation: shab-nam
  meaning: dew, dewdrops.
- word: chaahaton
  pronunciation: chaa-ha-ton
  meaning: desires, wishes, affections (plural of chaahat).
