title: Aaiye Meherbaan
movie: Howrah Bridge
year: '1958'
singers: Asha Bhosle
actors:
- Madhubala
- Ashok Kumar
composer: O.P. Nayyar
lyricist: Qamar Jalalabadi
youtube_channel: Saregama Music
resolution: 4K
theme: This song is a captivating invitation from a woman to her beloved, urging him
  to come closer and experience the depths of her affection. It conveys a sense of
  playful allure and a deep desire for intimacy and connection, expressing how his
  presence has enchanted her completely.
lyrics:
- section_name: Mukhda
  lines:
  - roman: Aaiye meherbaan, baithiye jaan-e-jaan
    devanagari: आइये मेहरबाँ, बैठिये जान-ए-जाँ
    english: Come, my gracious one, sit down, my beloved
    is_repeat: false
  - roman: Shauq se lijiye ji, ishq ka imtehaan
    devanagari: शौक़ से लीजिये जी, इश्क़ का इम्तिहाँ
    english: With pleasure, take this test of love
    is_repeat: false
  - roman: Aaiye meherbaan
    devanagari: आइये मेहरबाँ
    english: Come, my gracious one
    is_repeat: false
- section_name: Verse 1
  lines:
  - roman: Kaise ho tum naujawaan, kitne haseen mehmaan
    devanagari: कैसे हो तुम नौजवाँ, कितने हसीं मेहमान
    english: How youthful you are, what a beautiful guest
    is_repeat: false
  - roman: Kaise karoon main bayaan, dil ki nahin hai zubaan
    devanagari: कैसे करूँ मैं बयाँ, दिल की नहीं है ज़ुबाँ
    english: How can I express it, my heart has no tongue
    is_repeat: false
  - roman: Aaiye meherbaan
    devanagari: आइये मेहरबाँ
    english: Come, my gracious one
    is_repeat: true
- section_name: Verse 2
  lines:
  - roman: Dekha hai jab se tujhe, kuch bhi na bhaaye mujhe
    devanagari: देखा है जब से तुझे, कुछ भी न भाये मुझे
    english: Since I've seen you, nothing else pleases me
    is_repeat: false
  - roman: Har saans kehti hai ab, aaja gale lag jaa
    devanagari: हर साँस कहती है अब, आजा गले लग जा
    english: Every breath now says, come, embrace me
    is_repeat: false
  - roman: Aaiye meherbaan
    devanagari: आइये मेहरबाँ
    english: Come, my gracious one
    is_repeat: true
- section_name: Verse 3
  lines:
  - roman: Aankhon mein jaadu bhara, hothon pe shabnam pari
    devanagari: आँखों में जादू भरा, होठों पे शबनम पड़ी
    english: Your eyes are full of magic, dew has fallen on your lips
    is_repeat: false
  - roman: Dil mein hai armaan jaga, aaja gale lag jaa
    devanagari: दिल में है अरमान जगा, आजा गले लग जा
    english: Desires have awakened in my heart, come, embrace me
    is_repeat: false
  - roman: Aaiye meherbaan
    devanagari: आइये मेहरबाँ
    english: Come, my gracious one
    is_repeat: true
vocabulary:
- word: Meherbaan
  pronunciation: meh-her-baan
  meaning: Gracious, kind, benevolent. Used here as an endearing term for a beloved.
- word: Jaan-e-jaan
  pronunciation: jaan-eh-jaan
  meaning: Beloved, soul of my soul, darling. An intensely affectionate term.
- word: Shauq
  pronunciation: shauk
  meaning: Fondness, desire, pleasure, enthusiasm. Here, 'with pleasure' or 'with
    eagerness'.
- word: Imtehaan
  pronunciation: im-te-haan
  meaning: Test, examination, trial. In this context, a 'test of love'.
- word: Naujawaan
  pronunciation: nau-ja-waan
  meaning: Young, youthful person.
- word: Haseen
  pronunciation: ha-seen
  meaning: Beautiful, lovely, charming.
- word: Mehmaan
  pronunciation: meh-maan
  meaning: Guest.
- word: Bayaan
  pronunciation: ba-yaan
  meaning: To express, describe, narrate. 'Kaise karoon main bayaan' means 'How can
    I express?'
- word: Zubaan
  pronunciation: zoo-baan
  meaning: Tongue, language. 'Dil ki nahin hai zubaan' means 'my heart has no tongue
    (to speak its feelings)'.
- word: Bhaaye
  pronunciation: bhaa-ye
  meaning: To please, to like, to appeal to. 'Kuch bhi na bhaaye mujhe' means 'nothing
    else pleases me'.
- word: Saans
  pronunciation: saans
  meaning: Breath. 'Har saans kehti hai' means 'every breath says'.
- word: Gale lag jaa
  pronunciation: ga-le lag jaa
  meaning: Embrace me, hug me. An affectionate request for a close embrace.
- word: Jaadu
  pronunciation: jaa-doo
  meaning: Magic, charm, spell.
- word: Shabnam
  pronunciation: shab-nam
  meaning: Dew. Poetically used to describe freshness or tenderness on lips.
- word: Armaan
  pronunciation: ar-maan
  meaning: Desire, longing, wish, aspiration. 'Armaan jaga' means 'desires awakened'.
