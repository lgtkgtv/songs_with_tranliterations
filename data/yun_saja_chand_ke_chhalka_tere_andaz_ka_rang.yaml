title: Yun Saja Chand Ke Chhalka Tere Andaz Ka Rang
movie: Mirza Ghalib
year: '1954'
singers: Asha Bhosle
actors:
- Bharat Bhushan
- Suraiya
- Nigar Sultana
- Murad
composer: Ghulam Mohammed
lyricist: Mirza Ghalib
youtube_channel: Saregama Music
resolution: Standard Definition (480p)
theme: This ghazal is an exquisite ode to the beloved's unparalleled beauty and captivating
  charm. Through a series of vivid metaphors, it asserts that the unique essence and
  'color' of the beloved's presence surpasses all natural wonders, artistic expressions,
  and human emotions, making everything else pale in comparison. It conveys an overwhelming
  sense of adoration and the beloved's profound impact.
lyrics:
- section_name: Matla (Opening Couplet)
  lines:
  - roman: Yun saja chand ke chhalka tere andaaz ka rang
    devanagari: यूँ सज़ा चाँद के छलका तेरे अंदाज़ का रंग
    english: Thus the moon was adorned, and the color of your style overflowed,
    is_repeat: false
  - roman: Ho gayi raat basar din ke tarannum ka rang
    devanagari: हो गई रात बसर दिन के तरन्नुम का रंग
    english: The night passed, with the melody of the day's color.
    is_repeat: false
- section_name: Sher 1
  lines:
  - roman: Teri awaaz mein woh rang hai jo rang nahin
    devanagari: तेरी आवाज़ में वो रंग है जो रंग नहीं
    english: In your voice is that color, which is not found
    is_repeat: false
  - roman: Kisi gulshan mein, kisi phool mein, kisi shabnam ka rang
    devanagari: किसी गुलशन में, किसी फूल में, किसी शबनम का रंग
    english: In any garden, any flower, or any dewdrop's color.
    is_repeat: false
- section_name: Sher 2
  lines:
  - roman: Teri aankhon mein woh rang hai jo rang nahin
    devanagari: तेरी आँखों में वो रंग है जो रंग नहीं
    english: In your eyes is that color, which is not found
    is_repeat: false
  - roman: Kisi saagar mein, kisi mauj mein, kisi dariya ka rang
    devanagari: किसी सागर में, किसी मौज में, किसी दरिया का रंग
    english: In any ocean, any wave, or any river's color.
    is_repeat: false
- section_name: Sher 3
  lines:
  - roman: Teri baaton mein woh rang hai jo rang nahin
    devanagari: तेरी बातों में वो रंग है जो रंग नहीं
    english: In your words is that color, which is not found
    is_repeat: false
  - roman: Kisi mehfil mein, kisi saaz mein, kisi sargam ka rang
    devanagari: किसी महफ़िल में, किसी साज़ में, किसी सरगम का रंग
    english: In any gathering, any instrument, or any musical scale's color.
    is_repeat: false
- section_name: Sher 4
  lines:
  - roman: Teri surat mein woh rang hai jo rang nahin
    devanagari: तेरी सूरत में वो रंग है जो रंग नहीं
    english: In your face is that color, which is not found
    is_repeat: false
  - roman: Kisi tasveer mein, kisi aaine mein, kisi parchhai ka rang
    devanagari: किसी तस्वीर में, किसी आईने में, किसी परछाई का रंग
