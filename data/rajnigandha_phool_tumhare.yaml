     devanagari: "महके यूँ ही जीवन में"
     english: "May they fragrance life this way"
   - roman: "Aao saare bhed mitayein"
     devanagari: "आओ सारे भेद मिटाएँ"
     english: "Come, let's erase all differences"
   - roman: "Pyaar karein hum aapas mein"
     devanagari: "प्यार करें हम आपस में"
     english: "And love each other"
   - roman: "Door kahin se koi pukare"
     devanagari: "दूर कहीं से कोई पुकारे"
     english: "Someone calls from somewhere far away"
   - roman: "Resham jaise geet sunaye"
     devanagari: "रेशम जैसे गीत सुनाए"
     english: "Sings songs like silk"
   - roman: "Man ke taaron ko jhankare"
     devanagari: "मन के तारों को झँकारे"
     english: "Twangs the strings of the heart"
   - roman: "Madhumay jeevan ke geet gaye"
     devanagari: "मधुमय जीवन के गीत गाए"
     english: "Sings songs of a honey-sweet life"
   - roman: "Rajnigandha phool tumhare"
     devanagari: "रजनीगंधा फूल तुम्हारे"
     english: "Rajnigandha flowers like you"
