title: Rajnigandha Phool Tumhare
movie: Rajnigandha
year: '1974'
singers: Lata Mangeshkar
actors:
- Amol Palekar
- Vidya Sinha
composer: Salil Chowdhury
lyricist: Yogesh
youtube_channel: Saregama Music
resolution: Unknown
theme: This song is a heartfelt expression of love and devotion, comparing the beloved's
  presence and affection to the fragrant Rajnigandha flowers that fill life with beauty
  and joy. It conveys the idea that the beloved is the very essence and meaning of
  the singer's existence.
lyrics:
- roman: Rajnigandha phool tumhare, mahke yoon hi jeevan mein
  devanagari: रजनीगंधा फूल तुम्हारे, महके यूँ ही जीवन में
  english: May your Rajnigandha flowers, similarly fragrance in life
- roman: Yoon hi mahke preet piya ki, mere anuraagi man mein
  devanagari: यूँ ही महके प्रीत पिया की, मेरे अनुरागी मन में
  english: May the love of my beloved similarly fragrance, in my loving heart
- roman: Rajnigandha phool tumhare, mahke yoon hi jeevan mein
  devanagari: रजनीगंधा फूल तुम्हारे, महके यूँ ही जीवन में
  english: May your Rajnigandha flowers, similarly fragrance in life
- roman: Jab jab tumko dekhu, lage tum aur suhaane
  devanagari: जब जब तुमको देखूँ, लगे तुम और सुहाने
  english: Whenever I see you, you seem even more charming
- roman: Man karta hai, main gaati rahoon, geet tumhare
  devanagari: मन करता है, मैं गाती रहूँ, गीत तुम्हारे
  english: My heart wishes, I keep singing, your songs
- roman: Yoon hi mahke preet piya ki, mere anuraagi man mein
  devanagari: यूँ ही महके प्रीत पिया की, मेरे अनुरागी मन में
  english: May the love of my beloved similarly fragrance, in my loving heart
- roman: Rajnigandha phool tumhare, mahke yoon hi jeevan mein
  devanagari: रजनीगंधा फूल तुम्हारे, महके यूँ ही जीवन में
  english: May your Rajnigandha flowers, similarly fragrance in life
- roman: Tum jo nahin to, kya hai jeevan, tum jo nahin to, kya hai jeevan
  devanagari: तुम जो नहीं तो, क्या है जीवन, तुम जो नहीं तो, क्या है जीवन
  english: If you are not here, what is life, if you are not here, what is life
- roman: Tum hi to ho, mere jeevan ka, har pal, har kshan
  devanagari: तुम ही तो हो, मेरे जीवन का, हर पल, हर क्षण
  english: You are indeed, of my life, every moment, every instant
