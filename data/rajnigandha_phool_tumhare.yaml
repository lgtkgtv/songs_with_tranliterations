title: Rajnigandha Phool Tumhare
movie: Rajnigandha
year: '1974'
singers: Lata Mangeshkar
actors:
- Amol Palekar
- Vidya Sinha
composer: Salil Chowdhury
lyricist: Yogesh
youtube_channel: Shemaroo Filmi Gaane
resolution: 1080p
theme: This song is a romantic ode to a beloved, comparing their presence and love
  to the fragrant tuberose flower. It expresses deep admiration and the longing for
  the beloved's love to fill one's life and heart with beauty and support, much like
  stars light up the night.
lyrics:
- section_name: Chorus
  lines:
  - roman: Rajnigandha phool tumhaare
    devanagari: रजनीगंधा फूल तुम्हारे
    english: Tuberose flowers, yours,
    is_repeat: false
  - roman: Maheke yoon hi jeevan mein
    devanagari: महके यूँ ही जीवन में
    english: May they fragrance your life like this.
    is_repeat: false
  - roman: Yoon hi maheke preet piya ki
    devanagari: यूँ ही महके प्रीत पिया की
    english: May the love of my beloved also fragrance like this,
    is_repeat: false
  - roman: Mere anuraagi man mein
    devanagari: मेरे अनुरागी मन में
    english: In my loving heart.
    is_repeat: false
