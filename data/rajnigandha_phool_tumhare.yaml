title: "Rajnigandha Phool Tumhare"
movie: "Rajnigandha"
year: 1974
singers: "Lata Mangeshkar"
lyricist: "Yogesh"
composer: "Salil Chowdhury"
youtube_id: "_j5dRsWevdM"
theme: "This song is a tender ode to a beloved, likening their presence to the fragrant Rajnigandha flower, symbolizing purity and joy. It expresses a heartfelt wish for a life filled with shared happiness, free from differences, and emphasizes the profound impact of the loved one in making every moment beautiful and meaningful."
lyrics:
   - roman: "Rajnigandha phool tumhare"
     devanagari: "रजनीगंधा फूल तुम्हारे"
     english: "Rajnigandha flowers like you"
   - roman: "Mahke yoon hi jeevan mein"
     devanagari: "महके यूँ ही जीवन में"
     english: "May they fragrance life this way"
   - roman: "Aao saare bhed mitayein"
     devanagari: "आओ सारे भेद मिटाएँ"
     english: "Come, let's erase all differences"
   - roman: "Pyaar karein hum aapas mein"
     devanagari: "प्यार करें हम आपस में"
     english: "And love each other"
   - roman: "Khushiyon ke rangeen nazaare"
     devanagari: "खुशियों के रंगीन नज़ारे"
     english: "Colorful sights of happiness"
   - roman: "Subah shaam aate jaate"
     devanagari: "सुबह शाम आते जाते"
     english: "Come and go morning and evening"
   - roman: "Nutan jeevan ki bahaarein"
     devanagari: "नूतन जीवन की बहारें"
     english: "The springs of a new life"
   - roman: "Saath tumhare gaate gaate"
     devanagari: "साथ तुम्हारे गाते गाते"
     english: "While singing along with you"
   - roman: "Sooni hai har shaam suhaani"
     devanagari: "सूनी है हर शाम सुहानी"
     english: "Every pleasant evening is desolate"
   - roman: "Jab tak tum nahin milte"
     devanagari: "जब तक तुम नहीं मिलते"
     english: "Until you meet me"
   - roman: "Ujle man ki prem kahaani"
     devanagari: "उजले मन की प्रेम कहानी"
     english: "The love story of a pure heart"
   - roman: "Saath tumhare khilte khilte"
     devanagari: "साथ तुम्हारे खिलते खिलते"
     english: "Blooms as it unfolds with you"
   - roman: "Rajnigandha phool tumhare"
     devanagari: "रजनीगंधा फूल तुम्हारे"
     english: "Rajnigandha flowers like you"
