vocabulary:
   - word: "रजनीगंधा (Rajnigandha)"
     pronunciation: "ruh-jnee-gahn-dhah"
     meaning: "Tuberose (a highly fragrant white flower, scientifically *Polianthes tuberosa*). Often symbolizes purity, peace, and love. In the song, it's used metaphorically to address someone beautiful and fragrant like the flower."
   - word: "महके (Mahke)"
     pronunciation: "muh-h-ke"
     meaning: "To be fragrant, to spread fragrance, to exude a sweet smell."
   - word: "यूँ ही (Yoon hi)"
     pronunciation: "yoon hee"
     meaning: "Just like that, in this manner, simply, effortlessly. Implies a natural and continuous spread of fragrance/joy."
   - word: "भेद (Bhed)"
     pronunciation: "bhayd"
     meaning: "Differences, distinctions, disparities, secrets, divisions. In this context, it refers to misunderstandings or divisions between people."
   - word: "मिटाएँ (Mitaayein)"
     pronunciation: "mee-taa-yein"
     meaning: "Let's erase, let's wipe out, let's abolish, let's remove."
   - word: "आपस में (Aapas mein)"
     pronunciation: "aa-pus mayn"
     meaning: "Among ourselves, with each other, mutually."
   - word: "रंगीन (Rangeen)"
     pronunciation: "run-geen"
     meaning: "Colorful, vibrant, vivid."
   - word: "नज़ारे (Nazaare)"
     pronunciation: "nuh-zaa-re"
     meaning: "Sights, scenes, views, spectacles."
   - word: "नूतन (Nootan)"
     pronunciation: "noo-tun"
     meaning: "New, fresh, novel, modern."
   - word: "बहारें (Bahaarein)"
     pronunciation: "buh-haa-rein"
     meaning: "Springs (plural of *bahaar* - spring season). Metaphorically, joys, flourishing times, good fortunes."
   - word: "सूनी (Sooni)"
     pronunciation: "soo-nee"
     meaning: "Desolate, empty, lonely, silent, deserted."
   - word: "सुहानी (Suhaani)"
     pronunciation: "soo-haa-nee"
     meaning: "Pleasant, delightful, charming, lovely."
   - word: "उजले (Ujle)"
     pronunciation: "ooj-le"
     meaning: "Bright, pure, clean, radiant. Used here to describe a heart/mind, implying innocence and honesty."
   - word: "खिलते खिलते (Khilte khilte)"
     pronunciation: "khil-te khil-te"
     meaning: "As it blooms, as it unfolds, while blossoming (repetition emphasizes the continuous and gradual nature of blooming or developing)."
   - word: "रेशम (Resham)"
     pronunciation: "re-shum"
     meaning: "Silk. Used here metaphorically to describe songs that are smooth, soft, and pleasing like silk."
   - word: "झँकारे (Jhankare)"
     pronunciation: "jhun-kaa-re"
     meaning: "To twang, to strum, to cause to vibrate or resonate (like the strings of a musical instrument). Here, it means to stir or move the strings of the heart, evoking emotions."
   - word: "मधुमय (Madhumay)"
     pronunciation: "muh-dhoo-may"
     meaning: "Honey-sweet, sweet, delightful, blissful."