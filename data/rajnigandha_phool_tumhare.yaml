vocabulary:
- word: Rajnigandha
  pronunciation: raj-nee-gan-dhaa
  meaning: Tuberose, a highly fragrant white flower, often associated with love and
    romance in Indian culture.
- word: Phool
  pronunciation: phool
  meaning: Flower.
- word: Mahke
  pronunciation: mah-ke
  meaning: To fragrance, to spread fragrance, to smell sweet.
- word: Yoon hi
  pronunciation: yoon hee
  meaning: Similarly, just like this, in the same way, thus.
- word: Jeevan
  pronunciation: jee-van
  meaning: Life, existence.
- word: Preet
  pronunciation: preet
  meaning: Love, affection, fondness.
- word: Piya
  pronunciation: pi-yaa
  meaning: Beloved, darling; often used for a husband or lover.
- word: Anuraagi
  pronunciation: a-nu-raa-gee
  meaning: Loving, affectionate, passionate, devoted.
- word: Man
  pronunciation: man
  meaning: Heart, mind, soul, inner self.
- word: Jab jab
  pronunciation: jab jab
  meaning: Whenever, every time.
- word: Dekhu
  pronunciation: de-khoon
  meaning: I see, I look (first person singular, subjunctive/desire).
- word: Lage
  pronunciation: la-ge
  meaning: Seems, feels, appears.
- word: Aur
  pronunciation: aur
  meaning: More, further; also 'and'.
- word: Suhaane
  pronunciation: su-haa-ne
  meaning: Charming, pleasant, delightful, beautiful.
- word: Karta hai
  pronunciation: kar-taa hai
  meaning: Does, makes. In 'man karta hai', it means 'the heart wishes' or 'I feel
    like'.
- word: Gaati rahoon
  pronunciation: gaa-tee ra-hoon
  meaning: I keep singing (feminine form, expressing continuity).
- word: Geet
  pronunciation: geet
  meaning: Song.
- word: Har pal
  pronunciation: har pal
  meaning: Every moment.
- word: Har kshan
  pronunciation: har kshan
  meaning: Every instant, every second.
