vocabulary:
- word: Rajnigandha
  pronunciation: Ruh-j-nee-gun-dhaa
  meaning: Tuberose, a highly fragrant white flower, often associated with love and
    beauty in Indian culture.
- word: Phool
  pronunciation: Phool
  meaning: Flower.
- word: Maheke
  pronunciation: Muh-heh-kay
  meaning: To spread fragrance, to smell sweet, to blossom with scent.
- word: Jeevan
  pronunciation: Jee-vun
  meaning: Life.
- word: Yoon hi
  pronunciation: Yoon hee
  meaning: Like this, in this manner, simply.
- word: Preet
  pronunciation: Preet
  meaning: Love, affection, fondness.
- word: Piya
  pronunciation: Pee-yaa
  meaning: Beloved, darling (often used for a husband or lover).
- word: Anuraagi
  pronunciation: Uh-noo-raa-gee
  meaning: Loving, affectionate, passionate, devoted.
- word: Man
  pronunciation: Mun
  meaning: Heart, mind, soul, inner self.
- word: Jab jab
  pronunciation: Jub jub
  meaning: Whenever, every time.
- word: Dekhu
  pronunciation: Day-khoo
  meaning: I see, I look.
- word: Lage
  pronunciation: Luh-gay
  meaning: Seems, feels, appears.
- word: Chaand ka tukda
  pronunciation: Chaand kaa took-daa
  meaning: A piece of the moon; a metaphor for someone exceptionally beautiful or
    radiant.
- word: Chhup chhup ke
  pronunciation: Chhoop chhoop kay
  meaning: Secretly, stealthily, in hiding.
- word: Sochu
  pronunciation: So-choo
  meaning: I think, I ponder.
- word: Mukhda
  pronunciation: Mookh-daa
  meaning: Face; also refers to the opening lines or refrain of a song.
- word: Dhale
  pronunciation: Dhuh-lay
  meaning: Sets, declines (as in the setting of the sun or day).
- word: Chhup jaaye
  pronunciation: Chhoop jaa-yay
  meaning: Hides, disappears.
- word: Raat
  pronunciation: Raat
  meaning: Night.
- word: Chamke
  pronunciation: Chum-kay
  meaning: Shines, sparkles.
- word: Taare
  pronunciation: Taa-ray
  meaning: Stars.
- word: Waise hi
  pronunciation: Vay-say hee
  meaning: In the same way, similarly.
- word: Banke
  pronunciation: Bun-kay
  meaning: Becoming, as, in the form of.
- word: Sahaare
  pronunciation: Suh-haa-ray
  meaning: Support, सहारा (sahārā) means support, सहारे (sahāre) means as a support/support
    system.
