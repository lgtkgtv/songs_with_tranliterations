vocabulary:
   - word: "घड़ी (ghadi)"
     pronunciation: "ghuh-dee"
     meaning: "Literally 'clock' or 'watch', but in this context, refers to a 'moment' or 'instant'. It implies the fleeting nature of time."
   - word: "बदल रही है (badal rahi hai)"
     pronunciation: "buh-dul ruh-hee hai"
     meaning: "Is changing; is transforming. Describes a continuous action of alteration."
   - word: "रूप (roop)"
     pronunciation: "roop"
     meaning: "Form, appearance, guise, shape. Here, it refers to the various manifestations or phases that life takes."
   - word: "ज़िंदगी (zindagi)"
     pronunciation: "zin-duh-gee"
     meaning: "Life."
   - word: "छाँव (chhaon)"
     pronunciation: "chha-oh (like 'ch' in chair + 'ow' in cow)"
     meaning: "Shade, shadow. Metaphorically represents periods of comfort, peace, ease, or happiness in life."
   - word: "धूप (dhoop)"
     pronunciation: "dhoop"
     meaning: "Sunshine, sunlight. Metaphorically represents periods of hardship, challenges, difficulties, or struggles in life."
   - word: "पल (pal)"
     pronunciation: "pul"
     meaning: "Moment, instant. A very short duration of time."
   - word: "यहाँ (yahan)"
     pronunciation: "yuh-haan"
     meaning: "Here; at this place."
   - word: "जी भर (jee bhar)"
     pronunciation: "jee bhar"
     meaning: "To one's heart's content; to the fullest; completely satisfying. It implies living without reservation or regret."
   - word: "जियो (jiyo)"
     pronunciation: "jee-yo"
     meaning: "Live! (An imperative command, encouraging someone to live life fully)."
   - word: "समाँ (samaan)"
     pronunciation: "suh-maan"
     meaning: "Moment, atmosphere, ambiance, situation. Refers to the current state, time, or environment."
   - word: "कल (kal)"
     pronunciation: "kul"
     meaning: "Tomorrow; also yesterday. In this context, it specifically means 'tomorrow' or 'the future'."
   - word: "हो ना हो (ho naa ho)"
     pronunciation: "ho naa ho"
     meaning: "May or may not be; might not exist. Expresses uncertainty about the future or the continued existence of something/someone."
   - word: "चाहे (chaahe)"
     pronunciation: "chaa-hay"
     meaning: "Whoever, whatever, even if. Here, it means 'whoever'."
   - word: "पूरे दिल से (poore dil se)"
     pronunciation: "poo-ray dil say"
     meaning: "With a full heart; wholeheartedly; sincerely and completely."
   - word: "मिलता है (milta hai)"
     pronunciation: "mil-taa hai"
     meaning: "Is found; is met. From the verb 'milna' (to meet or to be found)."
   - word: "मुश्किल से (mushkil se)"
     pronunciation: "moosh-kil say"
     meaning: "With difficulty; rarely; hardly. Implies something that is not easily acquired or encountered."
   - word: "कहीं (kahin)"
     pronunciation: "kuh-heen"
     meaning: "Somewhere, anywhere. In this specific context, it means 'anywhere'."
   - word: "बस (bas)"
     pronunciation: "bus"
     meaning: "Only, just; enough. Here, it functions as 'only'."
   - word: "वही (wahi)"
     pronunciation: "wuh-hee"
     meaning: "That very one; precisely that. Used for emphasis."
   - word: "सबसे (sabse)"
     pronunciation: "sub-say"
     meaning: "Most; among all. Used to form superlatives (e.g., 'sabse haseen' = 'most beautiful')."
   - word: "हसीं (haseen)"
     pronunciation: "huh-seen"
     meaning: "Beautiful, charming, lovely. An adjective describing attractiveness."
   - word: "हाथ (haath)"
     pronunciation: "haath"
     meaning: "Hand."
   - word: "थाम लो (thaam lo)"
     pronunciation: "thaam lo"
     meaning: "Hold onto; grasp firmly; take hold of. An imperative command, urging someone to seize or keep."
   - word: "मेहरबां (meharbaan)"
     pronunciation: "may-hur-baan"
     meaning: "Kind, benevolent, compassionate, gracious person. Refers to someone who shows kindness and favor."
   - word: "पलकों (palkon)"
     pronunciation: "pul-kon"
     meaning: "Eyelids (plural of 'palk')."
   - word: "सिरहाने (sirhaane)"
     pronunciation: "sir-haa-nay"
     meaning: "At the head of (a bed); on the pillow. Here, it's a poetic metaphor meaning 'under the eyelids'."
   - word: "थके हारे (thake haare)"
     pronunciation: "thuh-kay haa-ray"
     meaning: "Tired and weary; exhausted. A compound adjective emphasizing profound tiredness."
   - word: "ख्वाब (khwaab)"
     pronunciation: "khwaab"
     meaning: "Dream."
   - word: "सुलाये हैं (sulaye hain)"
     pronunciation: "soo-laa-yay hain"
     meaning: "Have put to sleep; have lulled to sleep. From the causative verb 'sulaana' (to make someone sleep)."
   - word: "दिलों (dilon)"
     pronunciation: "dil-on"
     meaning: "Hearts (plural of 'dil')."
   - word: "सजाके (sajaake)"
     pronunciation: "suh-jaa-kay"
     meaning: "Having adorned; having decorated. From 'sajaana' (to adorn/decorate)."
   - word: "रखना (rakhna)"
     pronunciation: "rukh-naa"
     meaning: "To keep; to place. Here, it means 'to keep' or 'to preserve'."
   - word: "नज़ारे (nazaare)"
     pronunciation: "nuh-zaa-ray"
     meaning: "Sights, scenes, views (plural of 'nazaara'). Refers to beautiful or memorable visual experiences."
   - word: "तुम ही को (tum hi ko)"
     pronunciation: "tum hee ko"
     meaning: "Only you; to you alone (emphasizing 'you'). 'Hi' adds emphasis, 'ko' is a postposition indicating 'to'."
   - word: "बुलाये हैं (bulaaye hain)"
     pronunciation: "boo-laa-yay hain"
     meaning: "Have called; are calling. From 'bulaana' (to call or invite)."
   - word: "हवा (hawa)"
     pronunciation: "huh-waa"
     meaning: "Air, wind."
   - word: "बहारों (bahaaron)"
     pronunciation: "buh-haa-ron"
     meaning: "Of springs; of blooming seasons (plural genitive form of 'bahaar'). Metaphorically refers to fresh, vibrant, joyous, or youthful times."
   - word: "खुशबू (khushboo)"
     pronunciation: "khoosh-boo"
     meaning: "Fragrance, aroma, scent."