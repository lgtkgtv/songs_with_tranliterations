title: "Kal Ho Naa Ho"
movie: "Kal Ho Naa Ho"
year: 2003
singers: "Sonu Nigam"
lyricist: "Javed Akhtar"
composer: "Shankar-Ehsaan-Loy"
youtube_id: "cJT3de5BOik"
theme: "This song encapsulates the philosophy of living life to its fullest in the present moment, as tomorrow is uncertain. It beautifully explores themes of fleeting time, unconditional love, friendship, and the importance of cherishing every moment and person, even when faced with the inevitability of loss or separation."
lyrics:
   - roman: "Har ghadi badal rahi hai roop zindagi"
     devanagari: "हर घड़ी बदल रही है रूप ज़िंदगी"
     english: "Every moment, life is changing its form"
   - roman: "Chhaon hai kabhi kabhi hai dhoop zindagi"
     devanagari: "छाँव है कभी कभी है धूप ज़िंदगी"
     english: "Sometimes it's shade, sometimes it's sunshine, life is"
   - roman: "Har pal yahan jee bhar jiyo"
     devanagari: "हर पल यहाँ जी भर जियो"
     english: "Live every moment here to the fullest"
   - roman: "Jo hai samaan kal ho naa ho"
     devanagari: "जो है समाँ कल हो ना हो"
     english: "Whatever the moment is, tomorrow it may not be"
