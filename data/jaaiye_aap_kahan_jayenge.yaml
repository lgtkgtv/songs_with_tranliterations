vocabulary:
- word: Jaaiye
  pronunciation: jaa-ee-ye
  meaning: Go (formal/polite imperative form of 'jaana' - to go)
- word: Kahan
  pronunciation: ka-haan
  meaning: Where
- word: Jayenge
  pronunciation: jaa-yen-ge
  meaning: Will go (future tense, plural/formal for 'you')
- word: Nazar
  pronunciation: na-zar
  meaning: Gaze, sight, look, vision
- word: Laut ke
  pronunciation: lout ke
  meaning: Returning, turning back (from 'lautna' - to return)
- word: Phir
  pronunciation: phir
  meaning: Again, then
- word: Aayegi
  pronunciation: aa-ye-gi
  meaning: Will come (future tense, feminine singular, referring to 'nazar')
- word: Door tak
  pronunciation: door tak
  meaning: Far, far away, up to a distance
- word: Peechhe peechhe
  pronunciation: pee-chhe pee-chhe
  meaning: Behind, following closely
- word: Awaaz
  pronunciation: a-waaz
  meaning: Voice, sound
- word: Chali aayegi
  pronunciation: cha-li aa-ye-gi
  meaning: Will come along, will follow (feminine singular, referring to 'awaaz')
- word: Pyaar
  pronunciation: pyaar
  meaning: Love
- word: Yaad
  pronunciation: yaad
  meaning: Memory, remembrance
- word: Jahan
  pronunciation: ja-haan
  meaning: Wherever
- word: Aayega
  pronunciation: aa-ye-ga
  meaning: Will come (future tense, masculine singular, referring to 'yaad')
- word: Kaanta
  pronunciation: kaan-ta
  meaning: Thorn
- word: Sa
  pronunciation: sa
  meaning: Like, similar to (suffix)
- word: Dil
  pronunciation: dil
  meaning: Heart
- word: Chubha jayega
  pronunciation: chu-bhaa jaa-ye-ga
  meaning: Will prick, will pierce (from 'chubhāna' - to prick)
- word: Labon
  pronunciation: la-bon
  meaning: Lips (plural of 'lab')
- word: Tak
  pronunciation: tak
  meaning: Up to, till
- word: Aake
  pronunciation: aa-ke
  meaning: Having come (from 'aana' - to come)
- word: Ruk jayegi
  pronunciation: ruk jaa-ye-gi
  meaning: Will stop (from 'rukna' - to stop)
- word: Aankhon
  pronunciation: aan-khon
  meaning: Eyes (plural of 'aankh')
- word: Barsaat
  pronunciation: bar-saat
  meaning: Rain, shower (here, metaphorically refers to tears)
