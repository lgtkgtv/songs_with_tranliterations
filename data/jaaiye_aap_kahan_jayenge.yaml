title: Jaaiye Aap Kahan Jayenge
movie: Mere Sanam
year: '1965'
singers: Asha Bhosle
actors:
- Asha Parekh
- Biswajit Chatterjee
composer: O.P. Nayyar
lyricist: Majrooh Sultanpuri
youtube_channel: Shemaroo Filmi Gaane
resolution: HD
theme: This song is a playful and romantic challenge from a lover to their beloved,
  asserting that no matter where they go, the lover's memory, gaze, and voice will
  follow them. It conveys a sense of inescapable love and longing, promising that
  the beloved will always be reminded of their connection.
lyrics:
