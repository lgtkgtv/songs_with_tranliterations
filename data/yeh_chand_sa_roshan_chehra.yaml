title: Yeh Chand Sa Roshan Chehra
movie: Kashmir Ki Kali
year: '1964'
singers: Mohammed Rafi
actors:
- Shammi Kapoor
- Sharmila Tagore
composer: Shankar-Jaikishan
lyricist: Hasrat Jaipuri
youtube_channel: Saregama Music
resolution: HD
theme: This is a classic romantic song where the singer expresses profound admiration
  for his beloved's beauty. He compares her radiant face to the moon, her hair to
  golden strands, and her eyes to deep blue lakes, marveling at her creator's artistry
  and confessing his overwhelming love.
lyrics:
- section_name: Chorus
  lines:
  - roman: Yeh chand sa roshan chehra, zulfon ka rang sunehra
    devanagari: यह चाँद सा रोशन चेहरा, ज़ुल्फ़ों का रंग सुनहरा
    english: This face, bright like the moon, the golden color of her hair
    is_repeat: false
  - roman: Yeh jheel si neeli aankhen, koi raaz hai inmein gehra
    devanagari: यह झील सी नीली आँखें, कोई राज़ है इनमें गहरा
    english: These eyes, blue like a lake, there's some deep secret within them
    is_repeat: false
  - roman: Taareef karoon kya uski, jisne tumhe banaya
    devanagari: तारीफ़ करूँ क्या उसकी, जिसने तुम्हें बनाया
    english: How can I praise the one who created you?
    is_repeat: false
- section_name: Verse 1
  lines:
  - roman: Ek sundar sa sapna, main ban gaya apna
    devanagari: एक सुंदर सा सपना, मैं बन गया अपना
    english: A beautiful dream, I made it my own
    is_repeat: false
  - roman: Tumhe dekh ke dil mera, hua hai deewana
    devanagari: तुम्हें देख के दिल मेरा, हुआ है दीवाना
    english: Seeing you, my heart has gone crazy
    is_repeat: false
- section_name: Chorus
  lines:
  - roman: Yeh chand sa roshan chehra, zulfon ka rang sunehra
    devanagari: यह चाँद सा रोशन चेहरा, ज़ुल्फ़ों का रंग सुनहरा
