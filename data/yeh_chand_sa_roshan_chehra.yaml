- section_name: Verse 2
  lines:
  - roman: Zulfon ki ghani ghataayein, chehre pe bikhar jaayen
    devanagari: ज़ुल्फ़ों की घनी घटाएँ, चेहरे पे बिखर जाएँ
    english: Thick clouds of hair, spread across her face
    is_repeat: false
  - roman: Jab jab tu sharmaaye, bijli si chamak jaaye
