vocabulary:
   - word: "Maa"
     pronunciation: "Maah"
     meaning: "Mother. Here, it is used metaphorically and reverently to refer to Mother India (Bharat Maa)."
   - word: "Salaam"
     pronunciation: "Sa-laam"
     meaning: "A greeting or salutation, often conveying respect, peace, or homage. In this context, it means 'I salute you' or 'I bow to you'."
   - word: "Vande Mataram"
     pronunciation: "Vun-dey Ma-ta-rum"
     meaning: "A Sanskrit phrase meaning 'Hail to the Mother' or 'I bow to thee, Mother'. It is a nationalistic slogan and a hymn to the Motherland, deeply ingrained in Indian culture and history as a symbol of patriotism."
   - word: "Jitni"
     pronunciation: "Jit-nee"
     meaning: "However much, as much as."
   - word: "Mohabbat"
     pronunciation: "Mo-hub-but"
     meaning: "Love, affection. Used here to express profound love for the Motherland."
   - word: "Koshish"
     pronunciation: "Koh-shish"
     meaning: "An attempt, an effort, a try."
   - word: "Chheen lo"
     pronunciation: "Cheen loh"
     meaning: "To snatch away, to take away by force. It implies a challenge to anyone trying to harm or dispossess the nation."
   - word: "Subah"
     pronunciation: "Soo-bah"
     meaning: "Morning."
   - word: "Shaam"
     pronunciation: "Shaam"
     meaning: "Evening."
   - word: "Aasmaan"
     pronunciation: "Aas-maan"
     meaning: "Sky, heavens."
   - word: "Zameen"
     pronunciation: "Za-meen"
     meaning: "Earth, ground, land."
   - word: "Jahaan"
     pronunciation: "Ja-haan"
     meaning: "World, universe."
   - word: "Dil"
     pronunciation: "Dil"
     meaning: "Heart."
   - word: "Jaan"
     pronunciation: "Jaan"
     meaning: "Life, soul, beloved. Often used as an endearment."
   - word: "Imaan"
     pronunciation: "Ee-maan"
     meaning: "Faith, belief, conscience, integrity. Refers to one's core convictions."
   - word: "Pehchaan"
     pronunciation: "Peh-chaan"
     meaning: "Identity, recognition. What defines a person or a nation."
   - word: "Aankhon"
     pronunciation: "Aan-khon"
     meaning: "Eyes (plural of 'aankh')."
   - word: "Nikalte hain"
     pronunciation: "Ni-kul-te hain"
     meaning: "Emerge, come out, rise. Here, representing a strong, fiery spirit."
   - word: "Suraj"
     pronunciation: "Soo-raj"
     meaning: "Sun."
   - word: "Angaare"
     pronunciation: "Un-gaa-rey"
     meaning: "Embers, live coals. Metaphorically used to describe a fiery spirit, passion, or intense determination."
   - word: "Dilon"
     pronunciation: "Di-lon"
     meaning: "Hearts (plural of 'dil')."
   - word: "Baste hain"
     pronunciation: "Bus-tey hain"
     meaning: "Reside, dwell, inhabit. Implies a deep presence."
   - word: "Desh"
     pronunciation: "Desh"
     meaning: "Country, nation."
   - word: "Sitare"
     pronunciation: "Si-taa-rey"
     meaning: "Stars (plural of 'sitara'). Metaphorically used for brave people, heroes, or shining spirits of the nation."
   - word: "Har"
     pronunciation: "Hur"
     meaning: "Every, each."
   - word: "Khushi"
     pronunciation: "Khoo-shee"
     meaning: "Happiness, joy."
   - word: "Gham"
     pronunciation: "Ghum"
     meaning: "Sorrow, grief, sadness."