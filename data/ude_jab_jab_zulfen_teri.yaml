vocabulary:
  - word: "Zulfen"
    pronunciation: "Zool-fen"
    meaning: "Hair, specifically locks or tresses of hair."
  - word: "Kanwariyon"
    pronunciation: "Kun-waa-ri-yon"
    meaning: "Young, unmarried girls/maidens."
  - word: "Machle"
    pronunciation: "Much-lay"
    meaning: "To flutter, act restless, or get excited/agitated."
  - word: "Jind meriye"
    pronunciation: "Jind may-ree-yay"
    meaning: "A Punjabi term of endearment meaning 'Oh my life' or 'my soul'."
  - word: "Chikne"
    pronunciation: "Chik-nay"
    meaning: "Literally 'smooth' or 'glossy'. In this context, it colloquially means handsome or well-groomed."
  - word: "Phisle"
    pronunciation: "Phis-lay"
    meaning: "To slip. Used metaphorically here to mean losing one's focus or becoming distracted by beauty."
  - word: "Rut"
    pronunciation: "Root"
    meaning: "Season (often used poetically to refer to a season of love or spring)."
  - word: "Beriyon / Ber"
    pronunciation: "Bay-ri-yon / Bayr"
    meaning: "Berries / Jujube fruit (Ziziphus mauritiana). A common fruit in rural India."
  - word: "Sadke"
    pronunciation: "Sud-kay"
    meaning: "To sacrifice oneself, or to be utterly devoted to someone/something out of love."
  - word: "Yaar"
    pronunciation: "Yaar"
    meaning: "Friend or beloved/lover."
  - word: "Basta"
    pronunciation: "Bus-taa"
    meaning: "Resides, lives, or settles."
  - word: "Goriye"
    pronunciation: "Go-ree-yay"
    meaning: "A fair-skinned or beautiful young woman."
  - word: "Chhedenge"
    pronunciation: "Chhay-deng-gay"
    meaning: "Will tease, bother, or provoke."
  - word: "Nagan"
    pronunciation: "Naa-gun"
    meaning: "A female serpent/cobra. Often used metaphorically in Indian poetry to describe a woman's graceful, swaying walk."
  - word: "Jogi"
    pronunciation: "Jo-gee"
    meaning: "An ascetic, mystic, or snake-charmer. Here used playfully to imply someone will be captivated by her serpent-like walk."
  - word: "Sajna"
    pronunciation: "Suj-naa"
    meaning: "Beloved, sweetheart, or husband."
