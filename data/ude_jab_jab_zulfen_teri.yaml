vocabulary:
- word: Ude
  pronunciation: oo-day
  meaning: To fly, to flutter (here, referring to hair flying in the wind).
- word: Zulfen
  pronunciation: zool-fen
  meaning: Tresses, locks of hair (often long and flowing).
- word: Kawaariyon
  pronunciation: ka-waa-ree-yon
  meaning: Of maidens, unmarried girls (plural genitive form of 'kawaari' - maiden).
- word: Machle
  pronunciation: mach-lay
  meaning: To flutter, to be restless, to be agitated (often used for heart or mind).
- word: Chikne
  pronunciation: chik-nay
  meaning: Smooth, glossy, sleek. In this context, it implies alluring, attractive,
    or captivating.
- word: Nazar
  pronunciation: na-zar
  meaning: Gaze, sight, glance.
- word: Phisle
  pronunciation: phis-lay
  meaning: To slip, to slide. Here, 'nazar phisle' means the gaze slips or is drawn
    uncontrollably.
- word: Babu
  pronunciation: baa-boo
  meaning: A term of address for a gentleman, sir, or a young man, often used informally
    or playfully.
- word: Aali Janab
  pronunciation: aa-lee ja-naab
  meaning: Esteemed sir, respected sir (a formal and respectful address).
- word: Bigde
  pronunciation: big-day
  meaning: To get spoiled, to go bad, to misbehave, to become unruly. In this context,
    it implies getting flirtatious or crossing a line.
- word: Haseen
  pronunciation: ha-seen
  meaning: Beautiful, lovely (used for both people and things, but here for a person).
- word: Jawaan
  pronunciation: ja-waan
  meaning: Young, youthful.
- word: Chura lo
  pronunciation: choo-raa lo
  meaning: Steal (imperative, plural/respectful singular). 'Chura lena' means to steal.
- word: Chhedo
  pronunciation: chhay-do
  meaning: To tease, to bother, to disturb (imperative, plural/respectful singular).
    'Chhedna' means to tease.
