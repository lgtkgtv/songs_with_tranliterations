        devanagari: "हो जब ऐसे चिकने चेहरे"
        english: "Oh, when there are such smooth faces"
        is_repeat: true
      - roman: "To kaise na nazar phisle"
        devanagari: "तो कैसे ना नज़र फिसले"
        english: "Then how could one's gaze not slip (be distracted)?"
        is_repeat: false
      - roman: "To kaise na nazar phisle, jind meriye"
        devanagari: "तो कैसे ना नज़र फिसले, जिन्द मेरिये"
