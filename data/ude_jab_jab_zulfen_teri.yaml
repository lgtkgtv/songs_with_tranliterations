vocabulary:
- word: Ude
  pronunciation: Oo-day
  meaning: To fly, to flutter, to rise (here, referring to hair flying in the wind).
- word: Zulfen
  pronunciation: Zool-fen
  meaning: Tresses, locks of hair, especially long, flowing hair.
- word: Kawaariyon
  pronunciation: Ka-waa-ree-yon
  meaning: Of bachelors, unmarried young men (plural genitive case).
- word: Machle
  pronunciation: Much-lay
  meaning: To flutter, to be restless, to yearn, to be agitated with desire.
- word: Chikne
  pronunciation: Chik-nay
  meaning: Smooth, glossy. In this context, it implies attractive, charming, or alluring.
- word: Chehre
  pronunciation: Cheh-ray
  meaning: Faces (plural).
- word: Nazar phisle
  pronunciation: Na-zar phis-lay
  meaning: Gaze slips, to be attracted or captivated by someone's appearance.
- word: Peechhe pade hain
  pronunciation: Pee-chhay pa-day hain
  meaning: Are after, pursuing, following (often romantically).
- word: Ladke
  pronunciation: Lad-kay
  meaning: Boys, young men (plural).
- word: Taraf se
  pronunciation: Ta-raf say
  meaning: On behalf of, from the side of.
- word: Akela
  pronunciation: A-kay-la
  meaning: Alone, solitary.
- word: Haseena
  pronunciation: Ha-see-na
  meaning: A beautiful woman, a beauty.
- word: Kameenah
  pronunciation: Ka-mee-na
  meaning: Rascal, scoundrel, naughty one. Used playfully here, not as a serious insult.
- word: Dekhke
  pronunciation: Dekh-kay
  meaning: By seeing, upon seeing (gerund form of 'dekhna' - to see).
- word: Dhadakta hai
  pronunciation: Dha-dak-ta hai
  meaning: Beats, throbs (referring to the heart).
- word: Roop
  pronunciation: Roop
  meaning: Beauty, form, appearance, charm.
- word: Jaadu
  pronunciation: Jaa-doo
  meaning: Magic, spell, enchantment.
- word: Chalta hai
  pronunciation: Chal-ta hai
  meaning: Works, operates, runs (here, referring to magic working its effect).
