theme: "A playful, flirtatious banter between a young man and woman in a rustic, village setting. The song is a back-and-forth exchange where the man playfully teases the woman about her beauty and its effect on men, and she cleverly responds, matching his wit."
lyrics:
  - section_name: "Chorus (Male)"
    lines:
      - roman: "Ho ude jab jab zulfen teri"
        devanagari: "हो उड़े जब जब ज़ुल्फ़ें तेरी"
        english: "Oh, whenever your hair flies in the breeze"
        is_repeat: false
      - roman: "Ho ude jab jab zulfen teri"
        devanagari: "हो उड़े जब जब ज़ुल्फ़ें तेरी"
        english: "Oh, whenever your hair flies in the breeze"
        is_repeat: true
      - roman: "Kanwariyon ka dil machle"
        devanagari: "कँवारियों का दिल मचले"
        english: "The hearts of young, unmarried girls flutter"
        is_repeat: false
      - roman: "Kanwariyon ka dil machle, jind meriye"
        devanagari: "कँवारियों का दिल मचले, जिन्द मेरिये"
        english: "The hearts of young girls flutter, oh my life"
        is_repeat: false
  - section_name: "Chorus (Female)"
    lines:
      - roman: "Oh jab aise chikne chehre"
        devanagari: "ओह जब ऐसे चिकने चेहरे"
