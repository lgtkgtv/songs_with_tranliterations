- section_name: Verse 2
  lines:
  - roman: Aap ki manzil hoon main, meri manzil aap hain
    devanagari: आप की मंज़िल हूँ मैं, मेरी मंज़िल आप हैं
    english: I am your destination, and you are my destination
    is_repeat: false
  - roman: Kyun main na miloon aap se, jaan-e-man jab aap hain
    devanagari: क्यूँ मैं ना मिलूँ आप से, जान-ए-मन जब आप हैं
