vocabulary:
- word: Nazron
  pronunciation: naz-rōñ
  meaning: Plural of 'nazar', meaning 'gazes' or 'eyes'. In context, 'your eyes'.
- word: Samjha
  pronunciation: sam-jhā
  meaning: Understood, comprehended. From the verb 'samajhna' (to understand).
- word: Pyaar
  pronunciation: pyār
  meaning: Love, affection.
- word: Qaabil
  pronunciation: qā-bil
  meaning: Worthy, capable, deserving.
- word: Dhadkan
  pronunciation: dhad-kan
  meaning: Heartbeat, pulse.
- word: Thaher ja
  pronunciation: tha-her jā
  meaning: Stop, pause. An imperative command.
- word: Manzil
  pronunciation: man-zil
  meaning: Destination, goal, objective.
- word: Manzoor
  pronunciation: man-zōōr
  meaning: Accepted, agreed, approved.
- word: Faisla
  pronunciation: fai-slā
  meaning: Decision, judgment, verdict.
- word: Banda parvar
  pronunciation: ban-dā par-var
  meaning: Literally 'cherisher of servants'. A respectful and deferential term of
    address, often used for a king, master, or beloved, implying 'my protector' or
    'my benefactor'.
- word: Shukriya
  pronunciation: shuk-ri-yā
  meaning: Thank you, gratitude.
- word: Do jahaan
  pronunciation: dō ja-hān
  meaning: Both worlds (this world and the afterlife/next world). Implies complete
    well-being.
- word: Khair
  pronunciation: khair
  meaning: Well-being, goodness, welfare.
- word: Dard-e-dil
  pronunciation: dard-e-dil
  meaning: Pain of the heart, heartache.
- word: Qaraar-e-dil
  pronunciation: qa-rār-e-dil
  meaning: Peace of heart, solace, tranquility for the heart.
- word: Jaan-e-man
  pronunciation: jān-e-man
  meaning: Beloved, darling, soulmate. Literally 'life of my heart/soul'.
- word: Haasil
  pronunciation: hā-sil
  meaning: Achieved, obtained, acquired. In context, 'life has been achieved' or 'I
    have found my life's purpose'.
