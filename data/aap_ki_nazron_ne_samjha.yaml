theme: This song is a heartfelt expression of gratitude and profound love. The protagonist
  feels validated and complete because their beloved's gaze has recognized their worth,
  bringing an end to their search for meaning and a sense of belonging.
lyrics:
- section_name: Chorus
  lines:
  - roman: Aap ki nazron ne samjha, pyaar ke qaabil mujhe
    devanagari: आप की नज़रों ने समझा, प्यार के क़ाबिल मुझे
    english: Your eyes understood me, worthy of love
    is_repeat: false
  - roman: Dil ki ai dhadkan thaher ja, mil gayi manzil mujhe
    devanagari: दिल की ऐ धड़कन ठहर जा, मिल गई मंज़िल मुझे
    english: Oh heartbeat of my heart, stop, I have found my destination
    is_repeat: false
  - roman: Aap ki nazron ne samjha
    devanagari: आप की नज़रों ने समझा
    english: Your eyes understood me
    is_repeat: false
- section_name: Verse 1
  lines:
  - roman: Ji hamein manzoor hai, aapka ye faisla
    devanagari: जी हमें मंज़ूर है, आपका ये फ़ैसला
    english: Yes, we accept, this decision of yours
    is_repeat: false
  - roman: Keh rahi hai har nazar, banda parvar shukriya
    devanagari: कह रही है हर नज़र, बंदा परवर शुक्रिया
    english: Every gaze is saying, 'Protector of servants, thank you'
    is_repeat: false
  - roman: Do jahaan ki khair ho, mil gaya dard-e-dil ko
    devanagari: दो जहाँ की ख़ैर हो, मिल गया दर्द-ए-दिल को
    english: May both worlds be blessed, the pain of my heart has found
    is_repeat: false
  - roman: Ab qaraar-e-dil mujhe
    devanagari: अब क़रार-ए-दिल मुझे
    english: Now, peace for my heart
    is_repeat: false
