- section_name: Antara 2
  lines:
  - roman: Yeh soch kar main darta hoon
    devanagari: ये सोच कर मैं डरता हूँ
    english: I fear thinking this
    is_repeat: false
  - roman: Tujhse mohabbat karta hoon
    devanagari: तुझसे मोहब्बत करता हूँ
    english: That I love you
    is_repeat: false
  - roman: Kahin dekh na le zamana mujhe
    devanagari: कहीं देख ना ले ज़माना मुझे
    english: Lest the world sees me
    is_repeat: false
  - roman: Chup chup ke aahein bharta hoon
    devanagari: चुप चुप के आहें भरता हूँ
    english: I sigh secretly
    is_repeat: false
  - roman: Duniya se darta hoon main
    devanagari: दुनिया से डरता हूँ मैं
    english: I am afraid of the world
    is_repeat: false
