title: Mere Mehboob Qayamat Hogi
movie: Mr X In Bombay
year: '1964'
singers: Kishore Kumar
actors:
- Joy Mukherjee
- Saroja Devi
composer: Laxmikant-Pyarelal
lyricist: Anand Bakshi
youtube_channel: Saregama Music
resolution: 4K
theme: This song expresses the intense despair and longing of a lover separated from
  their beloved. The singer imagines a catastrophic impact of their beloved's absence,
  portraying love as a force that can bring about a 'doomsday' of emotions and public
  disgrace in the streets where their love once blossomed.
lyrics:
- section_name: Mukhda
  lines:
  - roman: Mere mehboob qayamat hogi
    devanagari: मेरे महबूब क़यामत होगी
    english: My beloved, there will be a catastrophe
    is_repeat: false
  - roman: Aaj rusva teri galiyon mein mohabbat hogi
    devanagari: आज रुसवा तेरी गलियों में मोहब्बत होगी
    english: Today, love will be disgraced in your streets
    is_repeat: false
  - roman: Meri nazrein to gila karti hain
    devanagari: मेरी नज़रें तो गिला करती हैं
    english: My eyes do complain
    is_repeat: false
  - roman: Tere dil ko bhi sanam tujhse shikayat hogi
    devanagari: तेरे दिल को भी सनम तुझसे शिकायत होगी
    english: Even your heart, my darling, will have complaints against you
    is_repeat: false
- section_name: Antara 1
  lines:
  - roman: Teri gali main aata sanam
    devanagari: तेरी गली मैं आता सनम
    english: I used to come to your street, my darling
    is_repeat: false
  - roman: Nagma wafa ka gaata sanam
    devanagari: नग्मा वफ़ा का गाता सनम
    english: I used to sing songs of loyalty, my darling
    is_repeat: false
  - roman: Tujhse suna na jaata sanam
    devanagari: तुझसे सुना ना जाता सनम
    english: But you wouldn't listen, my darling
    is_repeat: false
  - roman: Phir aaj idhar aaya hoon main
    devanagari: फिर आज इधर आया हूँ मैं
    english: So today I have come here again
    is_repeat: false
  - roman: Magar yeh kehne aaya hoon main
    devanagari: मगर ये कहने आया हूँ मैं
    english: But I have come to say this
    is_repeat: false
  - roman: Mushkil hai jeena ab mere
    devanagari: मुश्किल है जीना अब मेरे
    english: It's difficult to live now, my dear
    is_repeat: false
  - roman: Mushkil hai jeena ab mere
    devanagari: मुश्किल है जीना अब मेरे
    english: It's difficult to live now, my dear
    is_repeat: true
  - roman: Tere bin mere mehboob
    devanagari: तेरे बिन मेरे महबूब
    english: Without you, my beloved
    is_repeat: false
- section_name: Chorus
  lines:
