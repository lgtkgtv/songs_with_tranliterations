vocabulary:
- word: Mehboob
  pronunciation: meh-boob
  meaning: Beloved, darling; a person who is loved.
- word: Qayamat
  pronunciation: ka-yaa-mat
  meaning: Catastrophe, doomsday, apocalypse, ultimate destruction; often used hyperbolically
    to express intense emotion or impact.
- word: Rusva
  pronunciation: rus-vaa
  meaning: Disgraced, dishonored, infamous; to be shamed or brought into disrepute,
    often publicly.
- word: Galiyon
  pronunciation: ga-li-yon
  meaning: Streets, lanes (plural of 'gali'); narrow roads or pathways.
- word: Mohabbat
  pronunciation: mo-hab-bat
  meaning: Love, affection; deep affection, fondness, or romantic love.
- word: Nazrein
  pronunciation: naz-ren
  meaning: Eyes, gazes (plural of 'nazar'); the organs of sight; also refers to one's
    gaze or attention.
- word: Gila
  pronunciation: gi-laa
  meaning: Complaint, grievance; an expression of dissatisfaction or discontent.
- word: Sanam
  pronunciation: sa-nam
  meaning: Darling, beloved, idol; a term of endearment for a lover or beloved person.
- word: Shikayat
  pronunciation: shi-kaa-yat
  meaning: Complaint; an expression of discontent or a formal statement that something
    is unsatisfactory.
- word: Nagma
  pronunciation: nag-maa
  meaning: Melody, song; a musical tune or a song, often implying a sweet or melodious
    one.
- word: Wafa
  pronunciation: wa-faa
  meaning: Loyalty, faithfulness; steadfastness in allegiance or affection; fidelity.
- word: Mushkil
  pronunciation: mush-kil
  meaning: Difficult, hard; not easy; requiring great effort or skill.
- word: Bin
  pronunciation: bin
  meaning: Without; lacking or not having something.
- word: Zamana
  pronunciation: za-maa-naa
  meaning: World, era, time; the world, society, or a particular period of time.
- word: Aahein bharna
  pronunciation: aa-hen bhar-naa
  meaning: To sigh, to lament; to emit a deep, audible breath expressing sadness,
    relief, or weariness.
