title: "Yeh Ratein Yeh Mausam"
movie: "Dilli Ka Thug"
year: 1958
singers: "Kishore Kumar, Asha Bhosle"
lyricist: "Shailendra"
composer: "Ravi"
youtube_id: "zMGYCKr5trw"
theme: "A classic romantic duet capturing the essence of new love blossoming in harmony with nature. The lovers project their feelings onto the moonlit night, riverbank, and breeze, culminating in a vow of eternal commitment."
lyrics:
  - roman: "Yeh ratein, yeh mausam, nadi ka kinara, yeh chanchal hawa"
    devanagari: "ये रातें, ये मौसम, नदी का किनारा, ये चंचल हवा"
    english: "These nights, this weather, the riverbank, this playful breeze."
  - roman: "Kaha do dilon ne, ki milkar kabhi hum na honge juda"
    devanagari: "कहा दो दिलों ने, कि मिलकर कभी हम ना होंगे जुदा"
    english: "Two hearts have declared that, having met, we shall never part."
  - roman: "Yeh kya baat hai aaj ki chandni mein"
    devanagari: "ये क्या बात है आज की चाँदनी में"
    english: "What is it about the moonlight tonight,"
  - roman: "Ki hum kho gaye pyar ki ragini mein"
    devanagari: "कि हम खो गए प्यार की रागिनी में"
    english: "That we are lost in the melody of love."
  - roman: "Yeh baahon mein baahein, yeh behki nigahein"
    devanagari: "ये बाहों में बाहें, ये बहकी निगाहें"
    english: "Arms wrapped around each other, these intoxicated gazes,"
  - roman: "Lo aane laga zindagi ka maza"
    devanagari: "लो आने लगा ज़िन्दगी का मज़ा"
    english: "Ah, the joy of life has begun to flow."
  - roman: "Sitaron ki mehfil ne karke ishara"
    devanagari: "सितारों की महफ़िल ने करके इशारा"
    english: "The gathering of stars has gestured,"
  - roman: "Kaha ab to sara jahan hai tumhara"
    devanagari: "कहा अब तो सारा जहाँ है तुम्हारा"
    english: "And said that now the entire world is yours."
  - roman: "Mohabbat jawan ho, khula aasman ho"
    devanagari: "मोहब्बत जवाँ हो, खुला आसमाँ हो"
    english: "When love is youthful and the sky is open,"
  - roman: "Kare koi dil aarzu aur kya"
    devanagari: "करे कोई दिल आरज़ू और क्या"
    english: "What else could a heart desire?"
  - roman: "Kasam hai tumhe tum agar mujhse ruthe"
    devanagari: "कसम है तुम्हें तुम अगर मुझसे रूठे"
    english: "You have sworn an oath, should you ever get upset with me,"
  - roman: "Rahe saans jab tak yeh bandhan na tute"
    devanagari: "रहे साँस जब तक ये बंधन ना टूटे"
    english: "As long as there is breath, this bond shall not break."
  - roman: "Tumhe dil diya hai, yeh wada kiya hai"
    devanagari: "तुम्हें दिल दिया है, ये वादा किया है"
    english: "I have given you my heart, and made this promise,"
  - roman: "Sanam main tumhari rahungi sada"
    devanagari: "सनम मैं तुम्हारी रहूँगी सदा"
    english: "My darling, I shall be yours forever."
vocabulary:
  - word: "Chanchal"
    pronunciation: "Chun-chull"
    meaning: "Playful, restless, or lively (often used to describe nature or a mischievous personality)."
  - word: "Juda"
    pronunciation: "Ju-daa"
    meaning: "Separated or parted from someone."
  - word: "Chandni"
    pronunciation: "Chaand-nee"
    meaning: "Moonlight. Derived from 'Chand' (Moon)."
  - word: "Ragini"
    pronunciation: "Raa-gi-nee"
    meaning: "A musical mode or melody in Indian classical music; here it metaphorically means the 'melody of love'."
  - word: "Behki"
    pronunciation: "Beh-kee"
    meaning: "Intoxicated, swaying, or dazzled (often used poetically to describe eyes lost in love)."
  - word: "Nigahein"
    pronunciation: "Ni-gaa-hain"
    meaning: "Gazes, glances, or eyes."
  - word: "Mehfil"
    pronunciation: "Meh-fill"
    meaning: "A gathering, assembly, or evening of entertainment. Here, personifying the stars as a gathering."
  - word: "Ishara"
    pronunciation: "I-shaa-raa"
    meaning: "A gesture, sign, or signal."
  - word: "Jahan"
    pronunciation: "Ja-haan"
    meaning: "The world or universe."
  - word: "Mohabbat"
    pronunciation: "Mo-hub-but"
    meaning: "Love, affection, or romance."
  - word: "Aarzu"
    pronunciation: "Aar-zoo"
    meaning: "A deep desire, wish, or yearning."
  - word: "Kasam"
    pronunciation: "Ka-sum"
    meaning: "An oath, vow, or swear."
  - word: "Roothe"
    pronunciation: "Roo-thay"
    meaning: "To sulk, be upset, or be gently angry with a loved one."
  - word: "Bandhan"
    pronunciation: "Bun-dhun"
    meaning: "A bond, tie, or relationship."
  - word: "Sanam"
    pronunciation: "Sa-num"
    meaning: "Darling, beloved, or sweetheart (literally 'idol')."
  - word: "Sada"
    pronunciation: "Sa-daa"
    meaning: "Forever, always, or eternally."
