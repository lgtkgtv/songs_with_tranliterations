vocabulary:
- word: Deewana
  pronunciation: dee-waa-naa
  meaning: Crazy, mad, infatuated; someone deeply in love to the point of being oblivious
    to other things.
- word: Mastaana
  pronunciation: mas-taa-naa
  meaning: Intoxicated, carefree, ecstatic; often used to describe a joyful or spirited
    state.
- word: Begaana
  pronunciation: be-gaa-naa
  meaning: Stranger, oblivious, unaware; in this context, it means being detached
    or unconcerned with.
- word: Shama
  pronunciation: sha-maa
  meaning: Candle; often used metaphorically for a source of light or attraction.
- word: Parwaana
  pronunciation: par-waa-naa
  meaning: Moth; specifically, a moth that is irresistibly drawn to a flame, even
    to its own destruction, symbolizing intense attraction or devotion.
- word: Pare
  pronunciation: pa-re
  meaning: Away, far; to move or stay at a distance.
- word: Jal jaayega
  pronunciation: jal jaa-ye-gaa
  meaning: Will burn; to be consumed by fire or passion.
- word: Thaam ke
  pronunciation: thaam ke
  meaning: Holding, grasping firmly; to control or restrain.
- word: Nazar daam ke
  pronunciation: na-zar daam ke
  meaning: Casting a captivating gaze; 'daam' here implies a charm or allure that
    ensnares, so a gaze that captivates or fixes attention.
- word: Jhuk jaana
  pronunciation: jhuk jaa-naa
  meaning: To bow down, to lower; in context of 'nazar', it means to lower one's gaze,
    often out of shyness or submission.
- word: Shayar
  pronunciation: shaa-yar
  meaning: Poet; a writer of poetry.
- word: Khoob
  pronunciation: khoob
  meaning: Well, good, excellent; used to express approval or quality.
- word: Mana kare
  pronunciation: ma-naa ka-re
  meaning: Forbid, prohibit; to prevent or disallow.
- word: Mehboob
  pronunciation: meh-boob
  meaning: Beloved; a person who is loved.
- word: Chhalak jaata hai
  pronunciation: chha-lak jaa-taa hai
  meaning: Overflows, spills; often used metaphorically for emotions or fate that
    cannot be contained.
- word: Paimana
  pronunciation: pai-maa-naa
  meaning: Cup, goblet; often used metaphorically for a measure of fate, destiny,
    or a full heart/emotion.
- word: Dhoop
  pronunciation: dhoop
  meaning: Sunlight, sun; direct exposure to the sun.
- word: Chhaon
  pronunciation: chhaon
  meaning: Shade; an area sheltered from direct sunlight.
- word: Girna sambhalna
  pronunciation: gir-naa sam-bhal-naa
  meaning: Falling and recovering; refers to the ups and downs, challenges, and resilience
    in life or a journey.
- word: Dariya
  pronunciation: da-ri-yaa
  meaning: River; often used metaphorically for life's journey or a continuous flow.
- word: Beh jaana
  pronunciation: beh jaa-naa
  meaning: To flow away, to drift; to move continuously like water.
