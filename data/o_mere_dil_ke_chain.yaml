vocabulary:
- word: Chain
  pronunciation: chain
  meaning: Peace, comfort, tranquility, rest. In this context, it refers to the beloved
    being the source of the singer's peace.
- word: Duaa
  pronunciation: doo-aa
  meaning: Prayer, wish, blessing. The singer asks the beloved to pray for his heart
    to find peace.
- word: Kijiye
  pronunciation: kee-jee-ye
  meaning: Please do (a formal and polite imperative verb). Used to make a respectful
    request.
- word: Saaya
  pronunciation: saa-yaa
  meaning: Shadow, reflection. Here, it refers to the beloved seeing their own reflection
    or image.
- word: Jaan-e-jahaan
  pronunciation: jaan-e-ja-haan
  meaning: Soul of the world, beloved. A very affectionate term of endearment.
- word: Sharma gaye
  pronunciation: shar-maa ga-ye
  meaning: Became shy, felt embarrassed. Refers to the beloved's bashfulness.
- word: Manzil
  pronunciation: man-zil
  meaning: Destination, stage, milestone. Here, it implies the beginning stage of
    their romantic journey.
- word: Ghabra gaye
  pronunciation: ghab-raa ga-ye
  meaning: Got nervous, became anxious or scared. Refers to the beloved's apprehension.
- word: Aaahein bhara
  pronunciation: aa-hen bha-raa
  meaning: To sigh, to lament, to express sorrow or longing with a sigh. The singer
    asks the beloved not to sigh.
- word: Armaan
  pronunciation: ar-maan
  meaning: Desire, wish, aspiration. The beloved's desires are the singer's own.
- word: Taraana
  pronunciation: ta-raa-naa
  meaning: Song, melody. The beloved's name is the singer's only song.
- word: Jhukti
  pronunciation: jhuk-tee
  meaning: Bending, lowered. Describes the beloved's eyelids.
- word: Palkon
  pronunciation: pal-kon
  meaning: Eyelids. Specifically, the lowered eyelids of the beloved.
- word: Siva
  pronunciation: si-vaa
  meaning: Besides, apart from, except for. Indicates exclusivity.
- word: Thikana
  pronunciation: thi-kaa-naa
  meaning: Abode, dwelling, refuge, place to stay. The beloved's lowered eyelids are
    the singer's only refuge.
- word: Jachta
  pronunciation: jach-taa
  meaning: Suits, looks good, appeals, is pleasing. No one else appeals to the singer's
    eyes.
- word: Chaaha
  pronunciation: chaa-haa
  meaning: Wished, desired, loved. The heart should only desire the beloved.
- word: Akela
  pronunciation: a-ke-laa
  meaning: Alone, solitary. The singer acknowledges being able to manage alone.
- word: Aksar
  pronunciation: ak-sar
  meaning: Often, frequently. Describes how often the singer can recover alone.
- word: Sambhal sakta hoon
  pronunciation: sam-bhal sak-taa hoon
  meaning: Can recover, can manage, can steady oneself. The ability to overcome difficulties.
- word: Badal sakta hoon
  pronunciation: ba-dal sak-taa hoon
  meaning: Can change. The singer's ability to change the world with the beloved's
    support.
- word: Maanga
  pronunciation: maan-gaa
  meaning: Asked for, requested. The singer has asked for the beloved for their shared
    future.
- word: Sanwarna
  pronunciation: san-war-naa
  meaning: To adorn oneself, to beautify, to improve one's appearance. Here, it implies
    preparing oneself for the relationship.
