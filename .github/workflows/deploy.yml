name: Build and Deploy to GitHub Pages

# Trigger the workflow on pushes to the main branch
on:
  push:
    branches:
      - main
      - master # Included just in case your default branch is named master
  workflow_dispatch: # Allows you to manually trigger a run from the GitHub UI

# Sets permissions required to deploy to GitHub Pages securely
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from stepping on each other
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    # Matching your local WSL2 environment
    runs-on: ubuntu-24.04 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" 

      - name: Build the static site
        run: |
          mkdir -p output
          uv run --with jinja2 --with pyyaml python build.py
          touch output/.nojekyll  # Bypasses GitHub's default Jekyll processing

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
