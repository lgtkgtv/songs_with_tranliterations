<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Transliterations Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --border: #cbd5e1;
            --bg-alt: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #475569;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            color: var(--text-main); 
            line-height: 1.4; 
            margin: 0; 
            padding: 1rem; 
            background: #ffffff;
            font-size: 14px; 
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* Compact Header */
        header { border-bottom: 2px solid #2563eb; padding-bottom: 0.5rem; margin-bottom: 1rem; }
        h1 { margin: 0 0 0.25rem 0; font-size: 1.5rem; }
        p { font-size: 0.9rem; color: var(--text-muted); margin: 0; }

        /* Dense Data Table */
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid var(--border); padding: 0.4rem 0.5rem; text-align: left; vertical-align: top; }
        th { background-color: #e2e8f0; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); }
        
        /* Zebra Striping */
        tbody tr:nth-child(even) { background-color: var(--bg-alt); }
        tbody tr:hover { background-color: #e0f2fe; }

        .song-title { font-weight: 600; color: #2563eb; text-decoration: none; }
        .song-title:hover { text-decoration: underline; }

        /* Responsive Mobile View */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            th { display: none; } /* Hide headers on mobile */
            td { border: none; border-bottom: 1px solid var(--border); padding: 0.4rem 0.5rem; }
            td:last-child { border-bottom: none; }
            tbody tr { border: 1px solid var(--border); margin-bottom: 0.75rem; display: flex; flex-direction: column; }
            td::before { font-weight: 600; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 0.2rem; }
            td:nth-of-type(1)::before { content: "Song Title"; }
            td:nth-of-type(2)::before { content: "Movie / Album"; }
            td:nth-of-type(3)::before { content: "Singers"; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Music Transliteration Archive</h1>
        <p>A collection of song translations and vocabulary guides designed for non-native speakers.</p>
    </header>

    <table>
        <thead>
            <tr>
                <th style="width: 40%;">Song Title</th>
                <th style="width: 30%;">Movie / Album</th>
                <th style="width: 30%;">Singers</th>
            </tr>
        </thead>
        <tbody>
            {% for song in songs %}
            <tr>
                <td><a href="{{ song.url }}" class="song-title">{{ song.title }}</a></td>
                <td>{{ song.movie }} ({{ song.year }})</td>
                <td>{{ song.singers }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
