<style>
    /* Add this to the <style> block in song_template.html */
    .hero-banner { display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap; }
    .hero-thumb { position: relative; width: 280px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-shrink: 0; }
    .hero-thumb img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
    .hero-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; transition: background 0.2s; text-decoration: none; }
    .hero-overlay:hover { background: rgba(0,0,0,0.4); }
    .hero-play { background: #ef4444; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; padding-left: 4px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
</style>

<!-- Inside the header-card -->
<header class="header-card">
    <div class="hero-banner">
        <a href="https://www.youtube.com/watch?v={{ youtube_id }}" target="_blank" class="hero-thumb">
            <img src="https://i.ytimg.com/vi/{{ youtube_id }}/maxresdefault.jpg" onerror="this.src='https://i.ytimg.com/vi/{{ youtube_id }}/hqdefault.jpg'" alt="Play Video">
            <div class="hero-overlay">
                <div class="hero-play">▶</div>
            </div>
        </a>
        
        <div>
            <h1>{{ title }}</h1>
            <div class="theme-section">
                <p>{{ theme }}</p>
            </div>
        </div>
    </div>
    
    <div class="meta-grid">
        <!-- Keep your existing meta-grid items here -->
        <div class="meta-item"><strong>Movie</strong> {{ movie }}</div>
        <div class="meta-item"><strong>Year</strong> {{ year }}</div>
        <div class="meta-item"><strong>Singers</strong> {{ singers }}</div>
        <div class="meta-item"><strong>Lyricist</strong> {{ lyricist }}</div>
        <div class="meta-item"><strong>Composer</strong> {{ composer }}</div>
    </div>
</header>
